const PZ = {};

/* 1) 증거 제시: 빈칸마다 알맞은 단서/조문을 제시 */
PZ.evidence = (body, P, h) => {
  const sel = P.slots.map(() => null);
  const render = () => {
    body.innerHTML = `<div class="slots" style="grid-template-columns:${P.slots.length > 2 ? '1fr 1fr' : '1fr'}"></div>`;
    const box = body.firstChild;
    P.slots.forEach((s, i) => {
      const it = sel[i] ? itemOf(sel[i]) : null;
      const d = el('div', 'slot' + (it ? ' filled' : ''), `<div class="sq">${i + 1}. ${fmt(s.q)}</div><div class="sv ${it ? '' : 'none'}">${it ? `<span class="chip">${it.isLaw ? '헌법' : clueType(it)}</span> <b>${fmt(it.name)}</b>` : '눌러서 여행 자료·GCED 자료를 제시하세요'}</div>`);
      d.onclick = async () => { const r = await pickItem(h.panel, s.q, s.filter); if (r) { sel[i] = r; render(); } };
      box.appendChild(d);
    });
  };
  render();
  return {
    check() {
      if (sel.some(x => !x)) { h.fb('모든 빈칸에 자료를 제시해야 해요.'); return; }
      const bad = []; let msg = null;
      P.slots.forEach((s, i) => { if (!s.ans.includes(sel[i])) { bad.push(i); if (!msg && s.fb && s.fb[sel[i]]) msg = s.fb[sel[i]]; if (!msg && s.wrong) msg = s.wrong; } });
      if (!bad.length) return h.solved();
      const boxes = body.querySelectorAll('.slot');
      // 어느 칸이 틀렸는지는 알려주되, 정답은 알려주지 않음
      if (P.strict) return h.wrong(`${P.slots.length}칸 중 ${bad.length}칸이 맞지 않아요. 어느 칸인지는 스스로 찾아야 해요.`);
      boxes.forEach((b, i) => { b.classList.remove('bad', 'good'); void b.offsetWidth; b.classList.add(bad.includes(i) ? 'bad' : 'good'); });
      h.wrong((bad.length === P.slots.length ? '모든 칸을 다시 생각해 봐요. ' : `${bad.length}개의 칸이 맞지 않아요. `) + (msg || ''));
    },
    auto() { P.slots.forEach((s, i) => { autoCheckHave(s.ans, h.id + ' slot' + i); }); }
  };
};

/* 2) 증언 모순: 거짓 진술 선택 + 반박 증거 제시 */
PZ.contra = (body, P, h) => {
  let st = null, ev = null, tval = '';
  const render = () => {
    body.innerHTML = '';
    P.statements.forEach(s => {
      const d = el('div', 'stm' + (st === s.id ? ' sel' : ''), `<div class="who">${fmt(s.who)}</div><div class="say">“${fmt(s.text)}”</div>`);
      d.onclick = () => { st = s.id; render(); };
      body.appendChild(d);
    });
    const evBox = el('div', 'slot' + (ev ? ' filled' : ''), `<div class="sq">🔎 ${fmt(P.evq || '이 진술과 맞지 않는 증거는?')}</div><div class="sv ${ev ? '' : 'none'}">${ev ? `<b>${fmt(itemOf(ev).name)}</b>` : '눌러서 증거를 제시하세요'}</div>`);
    evBox.style.marginTop = '8px'; evBox.style.minHeight = '80px';
    evBox.onclick = async () => { const r = await pickItem(h.panel, P.evq || '이 진술과 맞지 않는 증거는?'); if (r) { ev = r; render(); } };
    body.appendChild(evBox);
    if (P.askTime) { const tb = el('div', 'slot filled', `<div class="sq">⏱ ${fmt(P.askTime.q)}</div><input class="nm" style="width:220px;font-size:22px" placeholder="예) 12:05" value="${tval}">`); tb.style.marginTop = '8px'; tb.style.minHeight = '70px'; tb.style.cursor = 'default'; const ip = tb.querySelector('input'); ip.oninput = () => { tval = ip.value; }; ip.onkeydown = e => e.stopPropagation(); body.appendChild(tb); }
  };
  render();
  return {
    check() {
      if (!st) { h.fb('먼저 사건과 맞지 않는 진술을 골라 주세요.'); return; }
      if (!ev) { h.fb('그 진술이 틀렸다는 증거를 제시해야 해요.'); return; }
      if (P.askTime) { const d = tval.replace(/\D/g, ''); if (!d) { h.fb('글이 실제로 떼어진 시각도 적어야 해요.'); return; } }
      const timeOk = !P.askTime || P.askTime.ans.includes(tval.replace(/\D/g, ''));
      const bad = (st !== P.answer) + (!P.evidence.includes(ev)) + (!timeOk);
      if (bad) return h.wrong(P.strict ? `세 가지(진술·증거·시각) 중 ${bad}가지가 맞지 않아요.` : (st !== P.answer ? ((P.fbStmt && P.fbStmt[st]) || '그 진술은 다른 증거들과 맞아떨어지는 것 같아요.') : !P.evidence.includes(ev) ? ((P.fbEv && P.fbEv[ev]) || '그 증거로는 반박하기 어려워요.') : '시각이 증거와 맞지 않아요.'));
      h.solved();
    },
    auto() { autoCheckHave(P.evidence, h.id); }
  };
};

/* 3) 카드 연결 */
PZ.match = (body, P, h) => {
  const asg = {}; let armed = null;
  const items = shuffleDet(P.items, hashStr(h.id));
  const render = () => {
    body.innerHTML = `<div class="match"><div class="col" data-c="i"><div style="font-weight:700;color:#5a4a2a">${fmt(P.leftTitle || '카드')}</div></div><div class="col" data-c="t"><div style="font-weight:700;color:#5a4a2a">${fmt(P.rightTitle || '연결할 곳')}</div></div></div>`;
    const ci = body.querySelector('[data-c=i]'), ct = body.querySelector('[data-c=t]');
    items.forEach(it => {
      const t = P.targets.find(x => x.id === asg[it.id]);
      const d = el('div', 'mitem' + (armed === it.id ? ' sel' : ''), `${fmt(it.t)}${t ? `<span class="tagto">→ ${fmt(t.t)}</span>` : ''}`);
      d.onclick = () => { armed = armed === it.id ? null : it.id; render(); };
      ci.appendChild(d);
    });
    P.targets.forEach(t => {
      const chips = items.filter(it => asg[it.id] === t.id).map(it => `<span class="chip">${plain(it.short || it.t).slice(0, 18)}</span>`).join('');
      const d = el('div', 'mtarget' + (armed ? ' armed' : ''), `<div class="tt">${fmt(t.t)}</div>${t.d ? `<div class="td">${fmt(t.d)}</div>` : ''}<div class="chips">${chips}</div>`);
      d.onclick = () => { if (!armed) { h.fb('왼쪽 카드를 먼저 고른 다음, 연결할 곳을 누르세요.'); return; } asg[armed] = t.id; armed = null; h.fb(''); render(); };
      ct.appendChild(d);
    });
  };
  render();
  return {
    check() {
      const un = items.filter(it => !asg[it.id]).length;
      if (un) { h.fb(`아직 연결하지 않은 카드가 ${un}장 있어요.`); return; }
      const bad = items.filter(it => asg[it.id] !== P.answer[it.id]).length;
      if (!bad) return h.solved();
      h.wrong(`${bad}장의 카드가 알맞지 않은 곳에 있어요. ` + (P.wrongTip || ''));
    }
  };
};

/* 4) 문서 분석 (여러 개 고르기) */
PZ.select = (body, P, h) => {
  const on = new Set();
  const render = () => {
    body.innerHTML = P.docTitle ? `<div style="font-weight:700;margin-bottom:8px;color:#5a4a2a">${fmt(P.docTitle)}</div>` : '';
    P.options.forEach((o, i) => {
      const d = el('div', 'opt' + (on.has(i) ? ' sel' : ''), `<span class="chk">${on.has(i) ? '✓' : ''}</span><span>${fmt(o.t)}</span>`);
      d.onclick = () => { on.has(i) ? on.delete(i) : on.add(i); render(); };
      body.appendChild(d);
    });
  };
  render();
  return {
    check() {
      if (!on.size) { h.fb('하나 이상 골라 주세요.'); return; }
      const need = P.options.map((o, i) => o.ok ? i : -1).filter(i => i >= 0);
      const wrongPick = [...on].filter(i => !P.options[i].ok);
      const miss = need.filter(i => !on.has(i));
      if (!wrongPick.length && !miss.length) return h.solved();
      let msg = '';
      if (wrongPick.length) { const o = P.options[wrongPick[0]]; msg = o.fb ? o.fb : `고른 것 중 ${wrongPick.length}개는 다시 생각해 봐요.`; }
      else msg = `거의 다 왔어요! 아직 찾지 못한 것이 ${miss.length}개 있어요.`;
      h.wrong(msg);
    }
  };
};

/* 5) 조문 암호 */
PZ.code = (body, P, h) => {
  body.innerHTML = `<div class="cipher">${fmt(P.cipher)}</div><div class="codebox"><input placeholder="${plain(P.ph || '암호 입력')}"></div>`;
  const inp = body.querySelector('input'); inp.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') h.panel.querySelector('[data-go]').click(); };
  setTimeout(() => inp.focus(), 60);
  return {
    check() {
      const v = inp.value.replace(/\s|[·,.\-]/g, '');
      if (!v) { h.fb('암호를 입력해 주세요.'); return; }
      if (P.answer.some(a => a.replace(/\s|[·,.\-]/g, '') === v)) return h.solved();
      h.wrong(P.wrongTip || '암호가 맞지 않아요. 자료를 다시 읽어 보세요.');
    }
  };
};

/* 6) 순서 맞추기 */
PZ.order = (body, P, h) => {
  let list = shuffleDet(P.items, hashStr(h.id) + 3);
  if (list.every((x, i) => x.id === P.items[i].id)) list.reverse();
  const render = () => {
    body.innerHTML = `${P.topLabel ? `<div style="color:#5a4a2a;font-weight:700;margin-bottom:6px">▲ ${fmt(P.topLabel)}</div>` : ''}<div class="order-list"></div>${P.bottomLabel ? `<div style="color:#5a4a2a;font-weight:700;margin-top:6px">▼ ${fmt(P.bottomLabel)}</div>` : ''}`;
    const box = body.querySelector('.order-list');
    list.forEach((it, i) => {
      const d = el('div', 'ord', `<span class="n">${i + 1}</span><span>${fmt(it.t)}</span><span class="mv"><button data-u>▲</button><button data-d>▼</button></span>`);
      d.querySelector('[data-u]').onclick = () => { if (i > 0) { [list[i - 1], list[i]] = [list[i], list[i - 1]]; render(); } };
      d.querySelector('[data-d]').onclick = () => { if (i < list.length - 1) { [list[i + 1], list[i]] = [list[i], list[i + 1]]; render(); } };
      box.appendChild(d);
    });
  };
  render();
  return {
    check() {
      const bad = list.filter((x, i) => x.id !== P.items[i].id).length;
      if (!bad) return h.solved();
      h.wrong(`${bad}개의 순서가 맞지 않아요. ` + (P.wrongTip || ''));
    }
  };
};

/* 7) 조항 만들기 */
PZ.build = (body, P, h) => {
  if (P.strict && !P._sh) { P._sh = 1; P.slots.forEach((s, i) => { s.opts = shuffleDet(s.opts, hashStr(h.id) + i * 13); }); }
  const pick = P.slots.map(() => null);
  let stage = 'pick';
  const sentence = () => P.slots.map((s, i) => pick[i] != null ? s.opts[pick[i]].t : `[${s.label}]`).join(' ');
  const render = () => {
    if (stage === 'edit') {
      body.innerHTML = `<div class="easy">좋아요! 이제 이 문장을 <b>친구들이 이해하기 쉬운 말로</b> 다듬어 보세요. (그대로 두어도 괜찮아요)</div><textarea class="wr" style="margin-top:10px;min-height:140px">${plain(sentence())}</textarea>`;
      return;
    }
    body.innerHTML = '<div class="build"></div><div class="preview"></div>';
    const b = body.querySelector('.build');
    P.slots.forEach((s, i) => {
      const row = el('div', 'bslot', `<div class="blabel">${i + 1}. ${fmt(s.label)}</div><div class="bopts"></div>`);
      s.opts.forEach((o, j) => { const d = el('div', 'bopt' + (pick[i] === j ? ' sel' : ''), fmt(o.t)); d.onclick = () => { pick[i] = j; h.fb(''); render(); }; row.querySelector('.bopts').appendChild(d); });
      b.appendChild(row);
    });
    body.querySelector('.preview').innerHTML = `📜 <b>${fmt(P.clauseTitle || '새 문장')}</b><br>${fmt(sentence())}`;
  };
  render();
  return {
    check() {
      if (stage === 'edit') {
        const v = body.querySelector('textarea').value.trim();
        if (v.length < 10) { h.fb('문장을 조금 더 완성해 주세요.'); return; }
        G.S.writes[P.saveKey] = { q: plain(P.clauseTitle), a: v, c: G.caseNo, cat: '나의 문장' }; save();
        return h.solved(P.okText);
      }
      if (pick.some(x => x == null)) { h.fb('모든 칸을 골라 주세요.'); return; }
      if (P.strict) { const nb = pick.filter((j, i) => !P.slots[i].opts[j].ok).length; if (nb) return h.wrong(`${P.slots.length}개의 근거 가운데 ${nb}곳이 자료와 맞지 않아요. 어느 곳인지는 스스로 찾아야 해요.`); if (P.noEdit) { if (P.saveKey) { G.S.writes[P.saveKey] = { q: plain(P.clauseTitle), a: plain(sentence()), c: G.caseNo, cat: P.saveCat || '나의 문장' }; save(); } return h.solved(P.okText); } }
      const badI = pick.findIndex((j, i) => P.slots[i].opts[j].ok === false);
      if (badI >= 0) return h.wrong(P.slots[badI].opts[pick[badI]].fb || '이 선택이 누군가를 소외시키지 않는지 다시 살펴봐요.');
      stage = 'edit'; h.fb('문장의 뼈대가 완성됐어요! 이제 다듬어 보세요.', true);
      h.panel.querySelector('[data-go]').textContent = '문장 확정';
      render();
    },
    auto() { P.slots.forEach((s, i) => { pick[i] = s.opts.findIndex(o => P.strict ? o.ok : o.ok !== false); }); if (P.saveKey) G.S.writes[P.saveKey] = { q: plain(P.clauseTitle), a: sentence(), c: G.caseNo, cat: '나의 문장' }; }
  };
};

/* 9) 빈칸 입력 퍼즐 (시간·숫자·낱말을 직접 계산해 적기) */
PZ.fill = (body, P, h) => {
  const norm = v => String(v).replace(/[\s:·,.\-시분]/g, '');
  body.innerHTML = (P.doc ? `<div class="cipher" style="margin-bottom:12px">${fmt(P.doc)}</div>` : '') + `<div class="slots" style="grid-template-columns:1fr">${P.fields.map((f, i) => `<div class="slot filled" style="cursor:default;min-height:0;display:flex;align-items:center;gap:14px"><div class="sq" style="flex:1;margin:0">${i + 1}. ${fmt(f.label)}</div><input class="nm" data-i="${i}" style="width:200px;font-size:22px" placeholder="${plain(f.ph || '')}"></div>`).join('')}</div>`;
  const ins = [...body.querySelectorAll('input')]; ins.forEach(x => x.onkeydown = e => e.stopPropagation());
  setTimeout(() => ins[0] && ins[0].focus(), 60);
  return {
    check() {
      if (ins.some(x => !x.value.trim())) { h.fb('모든 칸을 채워 주세요.'); return; }
      const bad = P.fields.filter((f, i) => !f.ans.map(norm).includes(norm(ins[i].value))).length;
      if (!bad) return h.solved();
      h.wrong(`${P.fields.length}칸 중 ${bad}칸이 자료와 맞지 않아요. ` + (P.wrongTip || ''));
    }
  };
};
PZ_TAG.fill = '빈칸 추리 미션';

/* 10) 세계시민 퀴즈: 한 문제씩. 틀리면 정답 대신 실마리만 주고 그 문제는 뒤로 미뤄 다시 나옴.
   P.qs = [{q, opts:[...], a: 정답 index, ex: 해설, hint: 실마리, img: html}] */
PZ.quiz = (body, P, h) => {
  const S = G.S;
  const qs = P.qs.map((q, i) => ({ ...q, i }));
  let queue = qs.map(q => q.i), cur = null, pick = null, phase = 'ask', tries = {};
  let order = [];
  const go = h.panel.querySelector('[data-go]');
  const next = () => {
    if (!queue.length) return h.solved(P.okText || '모든 문제를 해결했어요!');
    cur = qs[queue[0]]; pick = null; phase = 'ask';
    order = shuffleDet(cur.opts.map((_, j) => j), hashStr(h.id) + cur.i * 7 + (tries[cur.i] || 0) * 3);
    go.textContent = '정답 확인';
    render();
  };
  const render = () => {
    const done = qs.length - queue.length;
    body.innerHTML = `<div class="qprog">${qs.map(q => `<i class="${!queue.includes(q.i) ? 'ok' : q.i === cur.i ? 'now' : tries[q.i] ? 'bad' : ''}"></i>`).join('')}<span>${done} / ${qs.length} 해결</span></div>
      <div class="qq">Q. ${fmt(cur.q)}</div>${cur.img ? `<div class="qimg">${cur.img}</div>` : ''}<div class="qopts"></div><div class="qex"></div>`;
    const box = body.querySelector('.qopts');
    order.forEach(j => {
      const d = el('div', 'qopt' + (pick === j ? ' sel' : ''), fmt(cur.opts[j]));
      d.onclick = () => { if (phase !== 'ask') return; pick = j; h.fb(''); render(); };
      box.appendChild(d);
    });
  };
  next();
  return {
    check() {
      if (phase === 'shown') { queue.shift(); return next(); }
      if (pick == null) { h.fb('답을 하나 골라 주세요.'); return; }
      if (pick === cur.a) {
        beep('ok'); phase = 'shown';
        body.querySelectorAll('.qopt').forEach((d, k) => { if (order[k] === cur.a) d.classList.add('right'); });
        body.querySelector('.qex').innerHTML = `<b>✅ 정답!</b> ${fmt(cur.ex || '')}`;
        go.textContent = queue.length > 1 ? '다음 문제 →' : '미션 완료 →';
        h.fb('');
        return;
      }
      tries[cur.i] = (tries[cur.i] || 0) + 1; S.attempts[h.id] = (S.attempts[h.id] || 0) + 1; save(); beep('bad');
      body.querySelectorAll('.qopt').forEach((d, k) => { if (order[k] === pick) d.classList.add('wrongpick'); });
      body.querySelector('.qex').innerHTML = `<b>❌ 아쉬워요.</b> ${fmt(cur.hint || '자료를 다시 읽어 보세요.')}<br><small>이 문제는 뒤로 미뤄졌어요. 다른 문제를 푼 뒤 다시 나와요.</small>`;
      phase = 'wait'; go.disabled = true;
      setTimeout(() => { go.disabled = false; if (queue.length > 1) { queue.push(queue.shift()); } next(); }, G.auto ? 0 : 2600);
    },
    auto() { }
  };
};

/* 11) 세계지도 미션: 나라를 눌러 고르기. P.ans = ISO3 배열, P.optional = 골라도 감점 없는 나라, P.view = [x,y,w,h] */
function worldSVG(opts = {}) {
  const v = opts.view || [0, 0, WORLD_W, WORLD_H];
  let paths = '';
  for (const iso in WORLD) {
    const hl = opts.hl && opts.hl[iso];
    paths += `<path data-iso="${iso}" d="${WORLD[iso]}" class="cty${hl ? ' hl' : ''}"${hl ? ` style="fill:${hl}"` : ''}><title>${WORLD_KO[iso] || iso}</title></path>`;
  }
  const grat = [...Array(13)].map((_, i) => `<line x1="${i * WORLD_W / 12}" y1="0" x2="${i * WORLD_W / 12}" y2="${WORLD_H}"/>`).join('') + [...Array(7)].map((_, i) => `<line x1="0" y1="${i * WORLD_H / 6}" x2="${WORLD_W}" y2="${i * WORLD_H / 6}"/>`).join('');
  return `<svg class="worldmap" viewBox="${v.join(' ')}" preserveAspectRatio="xMidYMid meet"><rect x="-50" y="-50" width="${WORLD_W + (opts.wrap ? 400 : 100)}" height="${WORLD_H + 100}" class="sea"/><g class="grat">${grat}</g><g class="ctys">${paths}</g>${opts.wrap ? `<g class="ctys" transform="translate(${WORLD_W} 0)" style="pointer-events:none">${paths}</g>` : ''}${opts.over || ''}</svg>`;
}
/* 위도·경도 → 지도 좌표 */
function geo(lon, lat) { return [(lon + 180) / 360 * WORLD_W, (83 - lat) / 360 * WORLD_W]; }
PZ.map = (body, P, h) => {
  const sel = new Set();
  body.innerHTML = `<div class="mapwrap">${worldSVG({ view: P.view, over: P.over })}</div><div class="mapsel"></div>`;
  const svg = body.querySelector('svg');
  const refresh = () => {
    svg.querySelectorAll('.cty').forEach(p => p.classList.toggle('pick', sel.has(p.dataset.iso)));
    body.querySelector('.mapsel').innerHTML = sel.size ? `고른 나라: ${[...sel].map(i => `<span class="chip">${WORLD_KO[i] || i}</span>`).join(' ')}` : '<span style="color:#7c7f93">지도에서 나라를 눌러 고르세요. (다시 누르면 취소)</span>';
  };
  svg.querySelectorAll('.cty').forEach(p => p.onclick = () => { const i = p.dataset.iso; sel.has(i) ? sel.delete(i) : sel.add(i); h.fb(''); refresh(); });
  refresh();
  return {
    check() {
      if (!sel.size) { h.fb('지도에서 나라를 골라 주세요.'); return; }
      const opt = new Set(P.optional || []);
      const groups = P.groups || P.ans.map(a => [a]);   // groups: 그중 하나만 골라도 되는 묶음
      const missing = groups.filter(g => !g.some(x => sel.has(x))).length;
      const extra = [...sel].filter(i => !groups.some(g => g.includes(i)) && !opt.has(i)).length;
      if (!missing && !extra) return h.solved(P.okText);
      h.wrong(`${missing ? `찾아야 할 나라가 ${missing}곳 남았어요. ` : ''}${extra ? `관계없는 나라가 ${extra}곳 섞여 있어요. ` : ''}` + (P.wrongTip || ''));
    }
  };
};

/* 12) 지도 배치 미션: 카드를 골라 지도(그림) 위의 자리(핀)에 놓기. P.svg = 배경 SVG 문자열, P.pins = [{id,x,y,label}], P.items = [{id,t}], P.answer = {item: pin} */
PZ.pins = (body, P, h) => {
  const asg = {}; let armed = null;
  const items = shuffleDet(P.items, hashStr(h.id));
  const render = () => {
    body.innerHTML = `<div class="pinwrap"><div class="pinmap" style="${P.aspect ? `aspect-ratio:${P.aspect};flex:none;height:100%` : ''}">${P.svg}<div class="pinlayer"></div></div><div class="pincards"><div class="pct">${fmt(P.leftTitle || '카드를 고른 뒤 자리를 누르세요')}</div></div></div>`;
    const layer = body.querySelector('.pinlayer'), cards = body.querySelector('.pincards');
    P.pins.forEach(pn => {
      const placed = items.filter(it => asg[it.id] === pn.id);
      const d = el('div', 'pin' + (armed ? ' armed' : '') + (placed.length ? ' placed' : ''), `<span class="pdot">${pn.label || ''}</span>${placed.map(it => `<span class="pchip">${plain(it.short || it.t)}</span>`).join('')}`);
      Object.assign(d.style, { left: pn.x + '%', top: pn.y + '%' });
      d.onclick = () => { if (!armed) { h.fb('오른쪽 카드를 먼저 고르세요.'); return; } if (!P.multi) items.forEach(it => { if (asg[it.id] === pn.id) delete asg[it.id]; }); asg[armed] = pn.id; armed = null; h.fb(''); render(); };
      layer.appendChild(d);
    });
    items.forEach(it => {
      const at = P.pins.find(pn => pn.id === asg[it.id]);
      const c = el('div', 'mitem' + (armed === it.id ? ' sel' : ''), `${fmt(it.t)}${at ? `<span class="tagto">→ ${at.label}</span>` : ''}`);
      c.onclick = () => { armed = armed === it.id ? null : it.id; render(); };
      cards.appendChild(c);
    });
  };
  render();
  return {
    check() {
      const un = items.filter(it => !asg[it.id]).length;
      if (un) { h.fb(`아직 놓지 않은 카드가 ${un}장 있어요.`); return; }
      const bad = items.filter(it => asg[it.id] !== P.answer[it.id]).length;
      if (!bad) return h.solved(P.okText);
      h.wrong(`${bad}장의 카드가 맞지 않는 자리에 있어요. ` + (P.wrongTip || ''));
    }
  };
};

/* ============ 화면: 타이틀, 타임라인 지도, GCED 도감, 여권 기록, 교사용, 엔딩(세계시민 여권) ============ */
function openTitle() {
  G.token++; G.playing = false; G.caseNo = 0; curBg = null;
  showScreen('title');
  const sv = loadSave();
  const t = $('#title');
  t.innerHTML = `<div class="layer">${ART.bg('title')}</div>
    <div class="logo"><div class="t0">INCHEON GCED TIME TRAVEL</div><div class="t2">인천 GCED 알아보기</div><div class="t1">타임 패스포트 : 세계시민 여권을 찾아서</div><div class="t3">2015 인천선언에서 2026 인천형 세계시민교육까지, 시간을 건너는 세계시민 미션</div></div>
    <div class="menu">
      <button class="mbtn" data-a="new">⏳ 새로운 시간여행</button>
      <button class="mbtn" data-a="cont" ${sv ? '' : 'disabled'}>📂 이어하기${sv ? ` <small style="font-weight:400">(${sv.name} · ${sv.diff === 'hard' ? '어려움' : '쉬움'})</small>` : ''}</button>
      <button class="mbtn" data-a="rec" ${sv ? '' : 'disabled'}>🛂 나의 여권 기록</button>
      <button class="mbtn" data-a="arc">📖 GCED 도감</button>
      <button class="mbtn" data-a="how">❔ 게임 방법</button>
    </div>
    <div class="foot">초·중·고 세계시민교육용 비주얼 노벨 · 쉬움(초등) / 어려움(중·고) · 등장인물과 이야기는 가상이며, 연도·사업·기관 정보는 인천광역시교육청 자료를 바탕으로 했어요</div>
    <button class="teacher" data-a="teacher">👩‍🏫 교사용 모드</button>`;
  t.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
    const a = b.dataset.a; beep('click');
    if (a === 'new') {
      if (sv) { const ok = await confirmBox('새로 시작하면 이 기기에 저장된 기록이 지워져요. 새로 시작할까요?'); if (!ok) return; }
      G.S = newState(); save(); startPrologue();
    }
    if (a === 'cont') { G.S = sv; if (!G.S.prologue) startPrologue(); else if (G.S.cur) startCase(G.S.cur.c, G.S.cur.s); else openMap(); }
    if (a === 'rec') { G.S = sv; openRecord(); }
    if (a === 'arc') { if (!G.S) G.S = sv || newState(); openArchive(); }
    if (a === 'how') openHowTo();
    if (a === 'teacher') openTeacherGate();
  });
}
function confirmBox(q) {
  return new Promise(res => {
    const m = modal(`<h2>확인</h2><p>${fmt(q)}</p><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" data-n>아니요</button><button class="btn gold" data-y>네</button></div>`, { cls: 'paper', x: false });
    m.p.style.width = '560px';
    m.p.querySelector('[data-y]').onclick = () => { m.close(); res(true); };
    m.p.querySelector('[data-n]').onclick = () => { m.close(); res(false); };
  });
}
function openHowTo() {
  modal(`<h2>❔ 게임 방법</h2><div style="width:900px">
    <p>⏳ <b>시간여행</b> — 2015년부터 2026년까지 다섯 시대를 여행하며 흩어진 “인천 GCED 시간 조각”을 되찾아요. 시대마다 여권 스탬프를 받아요.</p>
    <p>🌱🔥 <b>난이도</b> — <b>쉬움</b>(초등, 도담과 함께)과 <b>어려움</b>(중·고, 세린과 함께)은 이야기와 미션이 달라요. 어려움은 자료 분석, 이해관계자 토론, 긴 글쓰기가 더 많아요.</p>
    <p>🔍 <b>탐험</b> — 반짝이는 곳과 인물을 눌러 자료를 모아요. 자료는 <b>시간여행 수첩</b>에, 핵심 정보는 <b>GCED 도감</b>에 저장돼요.</p>

/* 역량 점수 */
const SKILLS = [['info', '정보 활용', '자료를 찾고 모아 활용했는가'], ['critical', '비판적 사고', '근거로 진위와 관계를 판단했는가'], ['solve', '문제해결·자기관리', '문제를 스스로 해결했는가'], ['comm', '협력적 소통', '다른 입장과 소통했는가'], ['diverse', '다양성 존중', '다양한 문화와 사람을 존중했는가'], ['part', '공동체 참여', '실천 방안을 만들고 참여했는가']];
function computeStats(S) {
  const started = [0, 1, 2, 3, 4, 5, 6].filter(n => S.done[n] || (S.cur && S.cur.c === n) || S.clues.some(id => CLUES[id] && CLUES[id].c === n));
  const infoMax = Object.keys(CLUES).filter(id => isClue(id) && started.includes(CLUES[id].c) && (!CLUES[id].mode || CLUES[id].mode === S.diff)).length || 1;
  const infoGot = S.clues.filter(id => isClue(id)).length;
  const pct = k => k === 'info' ? Math.round(100 * (infoGot + (S.sc.info || 0)) / (infoMax + (S.mx.info || 0))) : (S.mx[k] ? Math.round(100 * S.sc[k] / S.mx[k]) : 0);
  const vals = SKILLS.map(([k, n, d]) => ({ k, n, d, v: Math.max(0, Math.min(100, pct(k))) }));
  const avg = vals.reduce((a, b) => a + b.v, 0) / vals.length;
  const total = Math.max(0, Math.round(avg * 10 - S.hints.total * 12));
  return { vals, total, hints: S.hints.total };
}
function citizenType(S) {
  const v = S.vals; const max = Math.max(...Object.values(v));
  const tops = Object.keys(v).filter(k => v[k] === max && max > 0);
  if (!tops.length) return { title: '모든 가치를 고르게 살핀 세계시민', desc: '한쪽으로 치우치지 않고 여러 가치를 함께 생각했어요.', keys: [] };
  if (tops.length === 1) return { ...VALUE_TYPES[tops[0]], keys: tops };
  return { title: tops.slice(0, 2).map(k => VALUE_TYPES[k].title).join(' + '), desc: tops.slice(0, 2).map(k => VALUE_TYPES[k].desc).join(' '), keys: tops };
}
const mins = ms => Math.max(0, Math.round((ms || 0) / 60000));

function teacherText(S) {
  const st = computeStats(S), ty = citizenType(S);
