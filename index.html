<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>인천 GCED 알아보기 : 타임 패스포트</title>
<meta name="description" content="2015 인천선언부터 2026 인천형 세계시민교육까지, 시간여행 세계시민교육 비주얼 노벨 (초·중·고)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2340; --paper:#f4f8f7; --gold:#43d1c2; --gold2:#1f9a8e; --navy:#13213f; --navy2:#21385e;
  --red:#d9534f; --mint:#4fb59a; --sky:#5aa7e0; --muted:#7c7f93;
  --font-ui:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-story:'Gowun Batang','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',serif;
  --font-title:'Black Han Sans','Do Hyeon','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0e1c;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:var(--font-ui);color:var(--ink);user-select:none;-webkit-user-select:none}
#wrap{position:relative;width:1280px;height:720px;transform-origin:center center;flex:none}
#game{position:absolute;inset:0;overflow:hidden;background:#000;border-radius:6px;box-shadow:0 0 60px rgba(0,0,0,.6)}
.layer{position:absolute;inset:0}
#bg svg,#bgNext svg{width:100%;height:100%;display:block}
#bgNext{opacity:0;transition:opacity .7s ease}
#bgNext.show{opacity:1}
#vignette{pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.35) 100%)}

/* characters */
#chars{pointer-events:none}
.sprite{position:absolute;bottom:-230px;width:480px;height:960px;transition:left .5s cubic-bezier(.3,.8,.3,1),opacity .4s,filter .3s,transform .35s;filter:drop-shadow(0 12px 14px rgba(0,0,0,.35))}
.sprite svg{width:100%;height:100%;overflow:visible}
.sprite.dim{filter:brightness(.62) saturate(.7) drop-shadow(0 12px 14px rgba(0,0,0,.35))}
.sprite.enter{opacity:0;transform:translateY(30px)}
.sprite.talk{transform:translateY(-6px)}
.sprite.lean{transform:translateY(-4px) rotate(-2deg) scale(1.03)}
.sprite.bounce{animation:bounce .5s}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px)}}
.sprite .blink{animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

/* hotspots */
#hotspots{z-index:5}
.hs{pointer-events:auto;position:absolute;border-radius:14px;cursor:zoom-in;transition:background .2s,box-shadow .2s}
.hs::before{content:'';position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:rgba(255,236,170,.95);box-shadow:0 0 10px 4px rgba(255,210,100,.75)}
.hs.done::before{background:rgba(160,230,190,.9);box-shadow:0 0 6px 2px rgba(120,220,170,.6);width:10px;height:10px;margin:-5px 0 0 -5px}
.hs::after{content:'';position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid rgba(255,236,170,.95);box-shadow:0 0 12px rgba(255,220,120,.9);animation:pulse 1.8s infinite}
.hs.done::after{border-color:rgba(160,230,190,.9);box-shadow:0 0 8px rgba(120,220,170,.7);animation:none;width:16px;height:16px;margin:-8px 0 0 -8px}
.hs:hover{background:rgba(255,236,170,.16);box-shadow:inset 0 0 0 2px rgba(255,236,170,.75)}
.hs .lbl{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;background:rgba(20,24,48,.92);color:#d9fbf5;padding:5px 12px;border-radius:20px;font-size:17px;opacity:0;pointer-events:none;transition:opacity .2s;border:1px solid rgba(67,209,194,.6)}
.hs:hover .lbl,.hs.showlbl .lbl{opacity:1}
@keyframes pulse{0%{transform:scale(.8);opacity:.9}80%{transform:scale(1.9);opacity:0}100%{opacity:0}}
#investBar{position:absolute;right:22px;bottom:22px;z-index:6;display:none;gap:10px;align-items:center}
#investBar .tag{background:rgba(20,24,48,.88);color:#d9fbf5;padding:10px 16px;border-radius:12px;font-size:18px;border:1px solid rgba(67,209,194,.5)}
#investHelp{pointer-events:none;position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:6;display:none;background:rgba(20,24,48,.85);color:#fff;padding:8px 20px;border-radius:30px;font-size:18px;border:1px solid rgba(67,209,194,.5)}

/* location */
#loc{position:absolute;left:20px;top:16px;z-index:7;display:none;align-items:center;gap:10px}
#loc .case{background:var(--era,#43d1c2);color:var(--navy);font-family:var(--font-title);padding:4px 12px;border-radius:6px;font-size:18px;letter-spacing:1px}
#loc .place{background:rgba(20,24,48,.82);color:#fff;padding:6px 16px;border-radius:6px;font-size:18px;border-left:4px solid var(--gold)}

/* top bar */
#topbar{position:absolute;right:14px;top:12px;z-index:8;display:none;gap:8px}
.tb{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(20,24,48,.82);color:#d9fbf5;border:1px solid rgba(67,209,194,.55);border-radius:12px;padding:6px 10px 4px;cursor:pointer;font-family:var(--font-ui);font-size:13px;min-width:62px;transition:transform .15s,background .2s}
.tb:hover{background:rgba(40,48,92,.95);transform:translateY(-2px)}
.tb svg{width:26px;height:26px}
.tb .badge{position:absolute;margin:-4px 0 0 30px;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;display:none}
.tb{position:relative}

/* dialog */
#dialog{position:absolute;left:40px;right:40px;bottom:20px;height:196px;z-index:9;display:none;cursor:pointer}
#dialog .box{position:absolute;inset:0;background:linear-gradient(180deg,rgba(24,32,63,.93),rgba(16,21,44,.96));border:2px solid rgba(67,209,194,.75);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 6px rgba(255,255,255,.03)}
#dialog .box::before{content:'';position:absolute;left:14px;right:14px;top:10px;bottom:10px;border:1px solid rgba(67,209,194,.22);border-radius:12px;pointer-events:none}
#nameplate{position:absolute;left:34px;top:-24px;padding:7px 26px;border-radius:12px 12px 12px 0;font-size:22px;font-weight:700;color:#fff;background:var(--gold2);box-shadow:0 4px 10px rgba(0,0,0,.35);letter-spacing:1px;font-family:var(--font-ui)}
#nameplate .role{font-size:14px;opacity:.85;margin-left:8px;font-weight:400}
#dtext{overflow-y:auto!important;position:absolute;left:44px;right:44px;top:36px;bottom:20px;color:#f6f1e3;font-family:var(--font-story);font-size:25px;line-height:1.62;word-break:keep-all;overflow:hidden}
#dtext.narr{color:#e7e1cf;font-style:normal}
#dtext em{color:#ffd36a;font-style:normal;font-weight:700}
#dtext b{color:#9fe0c8}
#next{position:absolute;right:30px;bottom:16px;color:var(--gold);font-size:22px;animation:nextb 1s infinite;display:none}
@keyframes nextb{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
#dlgtools{position:absolute;right:26px;top:-34px;display:flex;gap:6px}
#dlgtools button{background:rgba(20,24,48,.85);color:#d4ece8;border:1px solid rgba(67,209,194,.45);border-radius:8px;font-size:13px;padding:4px 10px;cursor:pointer;font-family:var(--font-ui)}

/* overlays */
#ovl{position:absolute;inset:0;z-index:20;pointer-events:none}
.panel-wrap{position:absolute;inset:0;background:rgba(8,10,24,.6);display:flex;align-items:center;justify-content:center;pointer-events:auto;animation:fadein .25s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.panel{position:relative;background:var(--paper);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.5);padding:28px 34px;max-height:660px;overflow:auto;color:var(--ink);animation:popin .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes popin{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.panel h2{margin:0 0 6px;font-family:var(--font-title);font-weight:400;font-size:32px;color:var(--navy);letter-spacing:1px}
.panel h3{margin:14px 0 6px;font-size:21px;color:var(--navy2)}
.panel .sub{color:var(--muted);font-size:17px;margin-bottom:14px}
.panel p{font-size:19px;line-height:1.65;margin:8px 0;word-break:keep-all}
.panel.paper{background:linear-gradient(#f7fbfa,#e8f1ef);border:1px solid #bcd4cf}
.x{position:absolute;right:14px;top:12px;width:40px;height:40px;border-radius:50%;border:none;background:#dcebe8;color:var(--navy);font-size:22px;cursor:pointer;z-index:2}
.x:hover{background:#c7dfdb}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-ui);font-size:20px;padding:12px 26px;border-radius:14px;border:none;cursor:pointer;background:var(--navy);color:#d9fbf5;box-shadow:0 4px 0 #0b1027;transition:transform .1s,box-shadow .1s,background .2s;font-weight:700}
.btn:hover{background:var(--navy2)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0b1027}
.btn.gold{background:var(--gold);color:var(--navy);box-shadow:0 4px 0 var(--gold2)}
.btn.gold:hover{background:#6fe0d4}
.btn.ghost{background:#dcebe8;color:var(--navy);box-shadow:0 4px 0 #a9c7c2}
.btn.small{font-size:16px;padding:8px 16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.center{text-align:center}

/* choice */
.choices{display:flex;flex-direction:column;gap:14px;width:820px;pointer-events:auto}
.choice-q{background:rgba(20,24,48,.92);color:#d9fbf5;border:2px solid rgba(67,209,194,.7);border-radius:16px;padding:16px 24px;font-size:23px;font-family:var(--font-story);text-align:center;margin-bottom:6px;word-break:keep-all}
.choice{background:linear-gradient(90deg,rgba(247,251,250,.97),rgba(232,242,240,.97));border:2px solid #bcd4cf;border-radius:14px;padding:15px 24px;font-size:21px;cursor:pointer;text-align:left;font-family:var(--font-ui);color:var(--ink);transition:transform .15s,border-color .2s;word-break:keep-all;line-height:1.45}
.choice:hover{transform:translateX(8px);border-color:var(--gold2)}
.choice .k{display:inline-block;width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;background:var(--navy);color:var(--gold);margin-right:12px;font-weight:700;font-size:17px}
.choice.used{opacity:.55}

/* popup (clue) */
.getcard{width:620px;text-align:center;padding:30px 36px}
.getcard .ribbon{display:inline-block;background:var(--navy);color:var(--gold);padding:6px 22px;border-radius:30px;font-size:18px;margin-bottom:12px;letter-spacing:2px}
.getcard .ic{width:120px;height:120px;margin:0 auto 10px}
.getcard .nm{font-size:28px;font-weight:700;color:var(--navy);margin-bottom:8px}
.getcard .ds{font-size:19px;line-height:1.65;text-align:left;background:#fff;border:1px dashed #a9c9c3;border-radius:12px;padding:14px 18px;white-space:pre-line;word-break:keep-all}
.law-box{background:#fff;border-left:6px solid var(--gold2);border-radius:10px;padding:14px 18px;font-family:var(--font-story);font-size:19px;line-height:1.7;text-align:left;word-break:keep-all}
.easy{background:#eaf6f1;border-radius:10px;padding:12px 16px;font-size:18px;line-height:1.6;margin-top:10px;text-align:left;word-break:keep-all}
.easy b{color:#1f7a62}

/* doc viewer */
.docview{width:820px}
.docview .docbody{background:#fff;border:1px solid #cfe1dd;border-radius:12px;padding:18px 24px;font-family:var(--font-story);font-size:19px;line-height:1.75;white-space:pre-line;word-break:keep-all;box-shadow:inset 0 0 30px rgba(120,180,170,.12)}

/* notebook */
.nb{width:1080px;height:640px;display:flex;flex-direction:column}
.tabs{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:10px;background:#dcebe8;cursor:pointer;font-size:17px;border:none;font-family:var(--font-ui);color:var(--ink)}
.tab.on{background:var(--navy);color:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;overflow:auto;padding:4px;flex:1;align-content:start}
.card{background:#fff;border:2px solid #cfe1dd;border-radius:14px;padding:12px;cursor:pointer;transition:transform .15s,border-color .15s;min-height:120px;display:flex;flex-direction:column;gap:6px;position:relative}
.card:hover{transform:translateY(-3px);border-color:var(--gold2)}
.card.sel{border-color:var(--sky);box-shadow:0 0 0 3px rgba(90,167,224,.35)}
.card .ct{font-size:13px;color:#fff;background:var(--muted);align-self:flex-start;padding:2px 8px;border-radius:6px}
.card .ct.law{background:var(--gold2)}.card .ct.testi{background:#8a5cc2}.card .ct.doc{background:#3c7fb8}.card .ct.ev{background:#4f9b6e}
.card .cn{font-weight:700;font-size:18px;color:var(--navy);line-height:1.3}
.card .cd{font-size:14px;color:#555;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.card.locked{background:#e6eceb;cursor:default;opacity:.7}
.card.locked .cn{color:#8a9a97}
.detail{display:flex;gap:18px;flex:1;min-height:0}
.empty{color:var(--muted);font-size:18px;padding:30px;text-align:center}

/* puzzle */
.pz{width:1120px;height:660px;display:flex;flex-direction:column;padding:22px 30px}
.pz .phead{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.pz .ptype{background:var(--navy);color:var(--gold);padding:5px 14px;border-radius:8px;font-size:15px;letter-spacing:1px}
.pz .ptitle{font-family:var(--font-title);font-size:28px;color:var(--navy)}
.pz .pintro{font-size:18px;line-height:1.6;color:#3d4160;margin-bottom:10px;word-break:keep-all}
.pz .pbody{flex:1;min-height:0;overflow:auto;padding:4px}
.pz .pfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;padding-top:10px;border-top:1px dashed #b5d0ca}
.fb{font-size:18px;color:#a03a2a;min-height:28px;flex:1;word-break:keep-all;line-height:1.45}
.fb.ok{color:#1f7a62}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.slot{background:#fff;border:2px dashed #a9c9c3;border-radius:14px;padding:12px 16px;cursor:pointer;min-height:118px;transition:border-color .2s,background .2s}
.slot:hover{border-color:var(--gold2);background:#f8fffd}
.slot .sq{font-size:17px;color:var(--navy2);font-weight:700;margin-bottom:8px;word-break:keep-all}
.slot .sv{font-size:17px;color:#444;word-break:keep-all}
.slot .sv.none{color:#aaa}
.slot.filled{border-style:solid;border-color:#9ab7d6}
.slot.bad{border-color:var(--red);animation:shake .4s}
.slot.good{border-color:var(--mint);background:#effaf5}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.stm{background:#fff;border:2px solid #cfe1dd;border-radius:14px;padding:12px 16px;margin-bottom:10px;cursor:pointer;display:flex;gap:14px;align-items:flex-start;transition:border-color .2s}
.stm:hover{border-color:var(--gold2)}
.stm.sel{border-color:var(--sky);background:#f2f8fd}
.stm .who{flex:none;width:96px;font-weight:700;color:var(--navy);font-size:17px}
.stm .say{font-size:18px;line-height:1.55;word-break:keep-all}
.opt{background:#fff;border:2px solid #cfe1dd;border-radius:12px;padding:12px 16px;margin-bottom:9px;cursor:pointer;font-size:18px;line-height:1.5;word-break:keep-all;display:flex;gap:12px;align-items:flex-start}
.opt:hover{border-color:var(--gold2)}
.opt.sel{border-color:var(--sky);background:#eef6fd}
.opt .chk{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid #b9a77f;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
.opt.sel .chk{background:var(--sky);border-color:var(--sky)}
.match{display:flex;gap:22px;height:100%}
.match .col{flex:1;display:flex;flex-direction:column;gap:9px}
.mitem{background:#fff;border:2px solid #cfe1dd;border-radius:12px;padding:10px 14px;cursor:pointer;font-size:17px;line-height:1.45;word-break:keep-all;position:relative}
.mitem:hover{border-color:var(--gold2)}
.mitem.sel{border-color:var(--sky);box-shadow:0 0 0 3px rgba(90,167,224,.3)}
.mitem .tagto{display:block;margin-top:6px;font-size:14px;color:#fff;background:var(--navy2);border-radius:6px;padding:2px 8px;width:max-content;max-width:100%}
.mtarget{background:#eaf5f2;border:2px dashed #98c2bb;border-radius:14px;padding:12px 14px;cursor:pointer;min-height:70px;transition:background .2s}
.mtarget:hover{background:#f0fbf8}
.mtarget.armed{border-color:var(--sky);background:#eef6fd}
.mtarget .tt{font-weight:700;color:var(--navy);font-size:18px;margin-bottom:4px}
.mtarget .td{font-size:14px;color:#666;line-height:1.4}
.mtarget .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{background:var(--navy2);color:#d9fbf5;border-radius:8px;padding:3px 9px;font-size:13px}
.codebox{display:flex;gap:10px;justify-content:center;margin:20px 0}
.codebox input{width:420px;font-size:30px;text-align:center;padding:12px;border-radius:12px;border:2px solid #a9c9c3;font-family:var(--font-ui);letter-spacing:6px}
.cipher{background:#20284d;color:#d9fbf5;border-radius:14px;padding:18px 24px;font-size:19px;line-height:1.9;font-family:var(--font-story);word-break:keep-all}
.cipher b{color:#7fe0c0}
.order-list{display:flex;flex-direction:column;gap:9px}
.ord{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #cfe1dd;border-radius:12px;padding:10px 14px;font-size:18px;word-break:keep-all}
.ord .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700}
.ord .mv{margin-left:auto;display:flex;gap:6px}
.ord .mv button{width:36px;height:36px;border-radius:8px;border:none;background:#dcebe8;cursor:pointer;font-size:18px}
.build .bslot{margin-bottom:14px}
.build .blabel{font-weight:700;color:var(--navy2);margin-bottom:6px;font-size:17px}
.build .bopts{display:flex;flex-wrap:wrap;gap:8px}
.bopt{background:#fff;border:2px solid #cfe1dd;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:17px;word-break:keep-all}
.bopt.sel{border-color:var(--sky);background:#eef6fd}
.preview{background:#fff;border-left:6px solid var(--mint);border-radius:10px;padding:14px 18px;font-family:var(--font-story);font-size:20px;line-height:1.7;margin-top:10px;word-break:keep-all}
textarea.wr{width:100%;min-height:120px;font-size:19px;font-family:var(--font-ui);padding:12px 14px;border-radius:12px;border:2px solid #a9c9c3;line-height:1.6;resize:none;background:#fff;user-select:text;-webkit-user-select:text}
input.nm{font-size:26px;padding:12px 16px;border-radius:12px;border:2px solid #a9c9c3;width:360px;text-align:center;font-family:var(--font-ui);user-select:text;-webkit-user-select:text}

/* picker (inside puzzle) */
.picker{position:absolute;inset:0;background:rgba(247,251,250,.98);border-radius:18px;padding:22px 28px;display:flex;flex-direction:column;z-index:3}

/* hint */
.hint{width:640px}
.hint .lv{display:flex;gap:10px;margin:10px 0}
.hint .lvb{flex:1;padding:10px;border-radius:12px;background:#dcebe8;text-align:center;font-size:16px}
.hint .lvb.on{background:var(--navy);color:var(--gold)}
.hint .htext{background:#fff;border-radius:12px;border:1px dashed #a9c9c3;padding:16px 18px;font-size:19px;line-height:1.65;word-break:keep-all;min-height:80px}

/* screens */
.screen{position:absolute;inset:0;z-index:15;display:none}
.screen.on{display:block}
#title .logo{position:absolute;left:0;right:0;top:70px;text-align:center}
#title .logo .t1{white-space:nowrap;font-family:var(--font-title);font-size:64px;color:#fff6dc;text-shadow:0 6px 0 #0f3a4a,0 10px 30px rgba(0,0,0,.6);letter-spacing:6px}
#title .logo .t2{font-family:var(--font-title);font-size:38px;color:var(--gold);text-shadow:0 3px 0 #08202a,0 6px 16px rgba(0,0,0,.6);margin-top:-6px;letter-spacing:3px}

/* ============ 캐릭터 렌더러 (애니메이션 캐릭터 일러스트 스타일) ============
   - 얼굴형·눈·눈썹·코·입·머리·체형·자세는 캐릭터마다 art_designs.js에서 개별 정의
   - 이 파일은 공통 "화풍"(선화·셀 음영·채색 규칙)만 담당 */
const ART = {};

  let uid = 0;
  const shade = (hex, amt) => {
    let c = hex.replace('#','');
    if(c.length===3) c = c.split('').map(x=>x+x).join('');
    let r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
    const f = v => Math.max(0,Math.min(255,Math.round(amt<0? v*(1+amt) : v+(255-v)*amt)));
    return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
  };
  ART.shade = shade;
  const r1 = v => Math.round(v*10)/10;
  const OL = '#3d2a22';
  ART.OL = OL;
  const LW = .66, LI = .8;   /* 외곽선은 가늘게(LW), 내부선은 더 섬세하게(LI) */
  const O = (w=3.4, c=OL) => `stroke="${c}" stroke-width="${r1(w*LW)}" stroke-linejoin="round" stroke-linecap="round"`;
  const P = (d, fill, w=3.4) => `<path d="${d}" fill="${fill}" ${O(w)}/>`;
  const L = (d, w=2, c=OL, op=1) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${r1(w*LI)}" stroke-linecap="round" stroke-linejoin="round" opacity="${op}"/>`;
  const F = (d, fill, op=1) => `<path d="${d}" fill="${fill}" opacity="${op}"/>`;
  ART.P = P; ART.L = L; ART.F = F; ART.O = O;

  /* ======================= 얼굴 ======================= */
  function faceParts(f){
    const {wt, w, jw, jy, cw, ch} = f;
    const cb = f.cheekbone || 0;
    const mx = (jw+cw)/2, my = (jy+ch)/2 + 2, ky = 14 + (jy-14)*.62, kx = jw + (w-jw)*.42;
    return {wt, w, jw, jy, cw, ch, cb, mx, my, ky, kx};
  }
  function facePath(f){
    const {wt, w, jy, cw, ch, cb, mx, my, ky, kx} = faceParts(f);
    return `M${-wt} -40 C${-wt-3} -12 ${-w-cb} 0 ${-w} 14 C${-w} ${r1(ky)} ${r1(-kx)} ${r1(jy-2)} ${r1(-mx)} ${r1(my)} Q${-cw-6} ${ch+1} 0 ${ch+2} Q${cw+6} ${ch+1} ${r1(mx)} ${r1(my)} C${r1(kx)} ${r1(jy-2)} ${w} ${r1(ky)} ${w} 14 C${w+cb} 0 ${wt+3} -12 ${wt} -40 C${wt+6} -112 ${-wt-6} -112 ${-wt} -40 Z`;
  }
  /* 턱 아래쪽만 살짝 굵게 — 선 굵기 변화 */
  function chinLine(f){
    const {cw, ch, mx, my} = faceParts(f);
    return `<path d="M${r1(-mx*.8)} ${r1(my+3)} Q${-cw-6} ${ch+1} 0 ${ch+2} Q${cw+6} ${ch+1} ${r1(mx*.8)} ${r1(my+3)}" fill="none" stroke="${OL}" stroke-width="2.9" stroke-linecap="round"/>`;
  }

  /* 눈 — 캐릭터별 눈매 파라미터로 모양 자체가 달라짐 */
  function eye(s, E, ex, skin, cid){
    let {sp, w, up, lo, tilt, peak, rx, ry, irisC} = E;
    let lash = E.lash||5, flick = E.flick||0, lower = E.lower||0, cover = E.cover||0;
    let idx = (E.look||0), idy = 0, irisS = 1;
    w *= 1.06; up *= 1.14; lo *= 1.05;
    const cx = s*sp, cy = 0;
    if(ex==='surprise'){ up*=1.22; lo*=1.12; irisS=.8; cover=0; }
    if(ex==='doubt'){ cover = Math.max(cover,.42); idx += 3; }
    if(ex==='serious'||ex==='angry'){ cover = Math.max(cover,.26); tilt -= 2; }
    if(ex==='sad'||ex==='worry'){ tilt += 3; idy += 2; cover = Math.max(cover,.12); }
    if(ex==='think'){ idx = 4; idy = -4; }
    if(ex==='point'){ up*=1.06; }
    const u = up*(1-cover);
    const I = [cx - s*w*0.92, cy+1], Ot = [cx + s*w, cy + tilt];
    const C1 = [cx - s*w*0.55 + s*peak*w, cy - u*1.3], C2 = [cx + s*w*0.45 + s*peak*w, cy - u*1.24 + tilt*.3];
    const D1 = [cx + s*w*0.55, cy + lo*1.15 + tilt*.35], D2 = [cx - s*w*0.45, cy + lo*1.12];
    const upperD = `M${r1(I[0])} ${r1(I[1])} C${r1(C1[0])} ${r1(C1[1])} ${r1(C2[0])} ${r1(C2[1])} ${r1(Ot[0])} ${r1(Ot[1])}`;
    const shape = `${upperD} C${r1(D1[0])} ${r1(D1[1])} ${r1(D2[0])} ${r1(D2[1])} ${r1(I[0])} ${r1(I[1])} Z`;
    if(ex==='happy' || ex==='cheer'){
      const k = E.happyArc || 1;
      return L(`M${r1(I[0])} ${r1(I[1]+3)} Q${r1(cx + s*peak*w*.5)} ${r1(cy - up*0.95*k)} ${r1(Ot[0])} ${r1(Ot[1]+3)}`, lash, OL) +
        (flick? L(`M${r1(Ot[0])} ${r1(Ot[1]+3)} l${r1(s*6*flick)} ${r1(-4*flick)}`, lash*.6) : '') +
        L(`M${r1(cx - s*w*.4)} ${r1(cy + lo*.7)} Q${r1(cx)} ${r1(cy+lo*.9)} ${r1(cx + s*w*.45)} ${r1(cy + lo*.6)}`, 1.4, OL, .6);
    }
    const id = 'e'+cid+(s>0?'r':'l');
    const RX0 = Math.max(rx*1.22, w*0.56), RY0 = Math.max(ry*1.22, RX0*1.3);
    const ix = cx + idx, iy = cy - u*0.05 + idy + (cover? up*cover*0.3:0);
    const RX = RX0*irisS, RY = RY0*irisS;
    const dk = shade(irisC,-.55), lt = shade(irisC,.38), vlt = shade(irisC,.6);
    let g = `<defs><clipPath id="${id}c"><path d="${shape}"/></clipPath><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${dk}"/><stop offset=".5" stop-color="${irisC}"/><stop offset="1" stop-color="${lt}"/></linearGradient></defs>`;
    g += `<path d="${shape}" fill="#fffdf9"/>`;
    g += `<g clip-path="url(#${id}c)">`;
    g += `<path d="${upperD} L${r1(Ot[0])} ${r1(Ot[1]+8)} L${r1(I[0])} ${r1(I[1]+8)}Z" fill="#c9d3e6" opacity=".45"/>`;
    g += `<ellipse cx="${r1(ix)}" cy="${r1(iy)}" rx="${r1(RX)}" ry="${r1(RY)}" fill="url(#${id}g)"/>`;
    g += `<ellipse cx="${r1(ix)}" cy="${r1(iy + RY*0.55)}" rx="${r1(RX*0.7)}" ry="${r1(RY*0.32)}" fill="${vlt}" opacity=".55"/>`;
    g += `<ellipse cx="${r1(ix)}" cy="${r1(iy+1)}" rx="${r1(RX*0.42)}" ry="${r1(RY*0.5)}" fill="#1b120e"/>`;
    g += `<ellipse cx="${r1(ix)}" cy="${r1(iy)}" rx="${r1(RX)}" ry="${r1(RY)}" fill="none" stroke="${shade(irisC,-.65)}" stroke-width="1.2"/>`;
    g += `<path d="M${r1(ix-RX)} ${r1(iy-RY*.3)} Q${r1(ix)} ${r1(iy-RY*1.05)} ${r1(ix+RX)} ${r1(iy-RY*.3)} L${r1(ix+RX)} ${r1(iy-RY-4)} L${r1(ix-RX)} ${r1(iy-RY-4)}Z" fill="#1b120e" opacity=".32"/>`;
    g += `<ellipse cx="${r1(ix - RX*0.36)}" cy="${r1(iy - RY*0.36)}" rx="${r1(RX*0.36)}" ry="${r1(RY*0.3)}" fill="#fff"/>`;
    g += `<circle cx="${r1(ix + RX*0.42)}" cy="${r1(iy + RY*0.4)}" r="${r1(Math.max(1.6,RX*0.15))}" fill="#fff" opacity=".9"/>`;
    g += `</g>`;
    if(E.crease) g += L(`M${r1(cx - s*w*.45)} ${r1(cy - u*1.32 - 6)} Q${r1(cx + s*w*.15)} ${r1(cy - u*1.5 - 7)} ${r1(cx + s*w*.85)} ${r1(cy - u*1.0 - 5 + tilt*.5)}`, 1.5, OL, .7);
    g += `<path d="${upperD}" fill="none" stroke="${OL}" stroke-width="${r1(lash*.82)}" stroke-linecap="round"/>`;
    g += `<path d="${upperD}" fill="none" stroke="${shade(irisC,-.5)}" stroke-width="${r1(lash*.3)}" stroke-linecap="round" opacity=".55" transform="translate(0 ${r1(lash*.35)})"/>`;
    g += `<path d="M${r1(C2[0])} ${r1(C2[1]+1)} Q${r1(Ot[0]-s*2)} ${r1(Ot[1]-3)} ${r1(Ot[0]+s*2)} ${r1(Ot[1]+2)} L${r1(Ot[0]-s*4)} ${r1(Ot[1]+3)} Z" fill="${OL}"/>`;
    if(flick>0){ g += L(`M${r1(Ot[0]-s*1)} ${r1(Ot[1])} q${r1(s*5*flick)} ${r1(-2*flick)} ${r1(s*8*flick)} ${r1(-8*flick)}`, lash*.55);
      if(flick>.85) g += L(`M${r1(cx + s*w*.62)} ${r1(cy - u*1.08)} q${r1(s*3)} ${r1(-3)} ${r1(s*5*flick)} ${r1(-8*flick)}`, lash*.4); }
    g += L(`M${r1(I[0])} ${r1(I[1])} l${r1(-s*2)} ${r1(2)}`, 1.6);
    g += L(`M${r1(Ot[0]-s*2)} ${r1(Ot[1]+3)} C${r1(D1[0])} ${r1(D1[1])} ${r1(cx + s*w*.1)} ${r1(cy+lo*1.08)} ${r1(cx - s*w*.25)} ${r1(cy+lo*1.02)}`, 1.6, OL, .75);
    if(lower>=.8){ g += L(`M${r1(cx + s*w*.55)} ${r1(cy + lo*1.02)} l${r1(s*2)} 4`, 1.3, OL, .8) + L(`M${r1(cx + s*w*.78)} ${r1(cy + lo*.8 + tilt*.3)} l${r1(s*3)} 3`, 1.3, OL, .8); }
    return g;
  }

  function brow(s, E, Bw, ex, col){
    const {sp, w, up} = E;
    const cx = s*sp;
    let base = -up*1.32 - Bw.gap;
    let iy = base + (Bw.inner||0), my = base - Bw.arch, oy = base + Bw.drop;
    const len = Bw.len||1.12;
    if(ex==='surprise'){ iy-=8; my-=9; oy-=6; }
    if(ex==='angry'||ex==='serious'){ iy+=6; my+=1; oy-=3; }
    if(ex==='sad'||ex==='worry'){ iy-=6; my-=2; oy+=4; }
    if(ex==='doubt'){ if(s<0){ iy+=4; my+=3; oy+=3; } else { iy-=4; my-=6; oy-=3; } }
    if(ex==='happy'||ex==='cheer'){ iy-=3; my-=4; oy-=2; }
    if(ex==='think'){ if(s>0){ iy-=3; my-=4; } else { iy+=2; } }
    const ix = cx - s*w*0.78, mx = cx + s*w*0.15, ox = cx + s*w*len;
    const th = Bw.th;
    const c = col;
    if(Bw.style==='bushy'){
      let o = '';
      for(let k=0;k<4;k++){ o += L(`M${r1(ix + s*k*2)} ${r1(iy + k)} Q${r1(mx)} ${r1(my + k*1.2)} ${r1(ox - s*k*2)} ${r1(oy + k*0.8)}`, th*0.55, c); }
      return o + L(`M${r1(ix)} ${r1(iy)} Q${r1(mx)} ${r1(my)} ${r1(ox)} ${r1(oy)}`, 1.2, OL, .6);
    }
    return `<path d="M${r1(ix)} ${r1(iy - th*.5)} Q${r1(mx)} ${r1(my - th*.6)} ${r1(ox)} ${r1(oy)} Q${r1(mx)} ${r1(my + th*.45)} ${r1(ix)} ${r1(iy + th*.5)} Z" fill="${c}" stroke="${shade(c,-.35)}" stroke-width="1"/>`;
  }

  function nose(N, skin){
    /* 코는 존재감 최소 — 작은 그림자 획 하나 */
    const y = N.y, d = shade(skin,-.3), dd = shade(skin,-.16);
    switch(N.type){
      case 'dot': return L(`M-1 ${y} Q1 ${y+1.5} 3 ${y}`, 1.8, d);
      case 'tick': return L(`M2 ${y-6} L-1 ${y}`, 1.7, d);
      case 'line': return F(`M3 ${y-10} Q6 ${y-4} 4 ${y} L1 ${y}Z`, dd, .5) + L(`M3 ${y-8} Q5 ${y-3} 1 ${y}`, 1.7, d);
      case 'adult': return F(`M3 ${y-13} Q7 ${y-5} 5 ${y} L1 ${y}Z`, dd, .5) + L(`M4 ${y-11} Q6 ${y-4} 1 ${y}`, 1.8, d) + L(`M-3 ${y+2} Q0 ${y+3} 3 ${y+2}`, 1.3, d, .6);
      case 'big': return F(`M3 ${y-14} Q9 ${y-4} 6 ${y+2} L0 ${y+2}Z`, dd, .55) + L(`M-5 ${y+1} Q0 ${y+5} 6 ${y+1}`, 1.9, d) + L(`M4 ${y-12} Q7 ${y-4} 5 ${y}`, 1.6, d, .8);
      case 'long': return F(`M3 ${y-16} Q8 ${y-6} 5 ${y} L1 ${y}Z`, dd, .5) + L(`M4 ${y-14} Q7 ${y-5} 1 ${y}`, 1.8, d);
      default: return L(`M2 ${y-5} L-1 ${y}`, 1.7, d);
    }
  }

  function mouth(M, ex){
    const y = M.y, w = M.w;
    const red = '#9a3438', tongue = '#ee8790';
    const open = (ww, h, teeth) => `<path d="M${r1(-ww)} ${y-2} Q0 ${y+1} ${r1(ww)} ${y-2} Q${r1(ww-1)} ${r1(y+h)} 0 ${r1(y+h+1)} Q${r1(-ww+1)} ${r1(y+h)} ${r1(-ww)} ${y-2}Z" fill="${red}" ${O(2.6)}/>` + (teeth?`<path d="M${r1(-ww+2)} ${y-1} Q0 ${y+2} ${r1(ww-2)} ${y-1} L${r1(ww-3)} ${y+3} Q0 ${y+5} ${r1(-ww+3)} ${y+3}Z" fill="#fff"/>`:'') + `<path d="M${r1(-ww*.55)} ${r1(y+h-3)} Q0 ${r1(y+h*0.35)} ${r1(ww*.55)} ${r1(y+h-3)} Q0 ${r1(y+h+1)} ${r1(-ww*.55)} ${r1(y+h-3)}Z" fill="${tongue}"/>`;
    const lipC = M.lip;
    let base = '';
    switch(ex){
      case 'happy': case 'cheer': base = open(w*1.05, w*1.0, M.teeth); break;
      case 'point': base = open(w*.85, w*.75, M.teeth); break;
      case 'surprise': base = `<ellipse cx="0" cy="${y+4}" rx="${r1(w*.45)}" ry="${r1(w*.6)}" fill="${red}" ${O(2.4)}/><ellipse cx="0" cy="${y+7}" rx="${r1(w*.25)}" ry="${r1(w*.2)}" fill="${tongue}"/>`; break;
      case 'sad': base = L(`M${r1(-w*.8)} ${y+5} Q0 ${y-3} ${r1(w*.8)} ${y+5}`, 2.6); break;
      case 'worry': base = `<path d="M${r1(-w*.6)} ${y+4} Q0 ${y-2} ${r1(w*.6)} ${y+4} Q0 ${y+8} ${r1(-w*.6)} ${y+4}Z" fill="${red}" ${O(2.2)}/>`; break;
      case 'doubt': base = L(`M${r1(-w*.8)} ${y+2} Q${r1(-w*.3)} ${y-2} 0 ${y+1} Q${r1(w*.4)} ${y+4} ${r1(w*.8)} ${y-2}`, 2.4); break;
      case 'angry': base = L(`M${r1(-w*.7)} ${y+3} Q0 ${y} ${r1(w*.7)} ${y+3}`, 2.6); break;
      case 'serious': base = L(`M${r1(-w*.65)} ${y+1} L${r1(w*.65)} ${y+1}`, 2.4); break;
      case 'think': base = L(`M${r1(-w*.2)} ${y+2} Q${r1(w*.3)} ${y+4} ${r1(w*.7)} ${y}`, 2.4); break;
      default:
        switch(M.type){
          case 'grin': base = open(w*.9, w*.7, M.teeth); break;
          case 'smirk': base = L(`M${r1(-w*.8)} ${y+1} Q${r1(w*.1)} ${y+5} ${r1(w*.85)} ${y-3}`, 2.4) + L(`M${r1(w*.9)} ${y-5} l2 2`, 1.6, OL, .7); break;
          case 'cat': base = L(`M${r1(-w*.9)} ${y-2} Q${r1(-w*.45)} ${y+5} 0 ${y} Q${r1(w*.45)} ${y+5} ${r1(w*.9)} ${y-2}`, 2.4); break;
          case 'flat': base = L(`M${r1(-w*.6)} ${y+1} Q0 ${y+2} ${r1(w*.6)} ${y+1}`, 2.3); break;
          case 'small': base = L(`M${r1(-w*.45)} ${y} Q0 ${y+3} ${r1(w*.45)} ${y}`, 2.3); break;
          case 'pout': base = L(`M${r1(-w*.4)} ${y+1} Q0 ${y-1} ${r1(w*.4)} ${y+1}`, 2.3) + L(`M${r1(-w*.25)} ${y+4} Q0 ${y+6} ${r1(w*.25)} ${y+4}`, 1.4, OL, .5); break;
          case 'firm': base = L(`M${r1(-w*.7)} ${y} Q0 ${y+3} ${r1(w*.7)} ${y-1}`, 2.5); break;
          default: base = L(`M${r1(-w*.8)} ${y-1} Q0 ${y+5} ${r1(w*.8)} ${y-1}`, 2.4);
        }
    }
    if(lipC && !['happy','cheer','point','surprise','worry'].includes(ex) && M.type!=='grin') base += `<path d="M${r1(-w*.55)} ${y+3} Q0 ${y+8} ${r1(w*.55)} ${y+3} Q0 ${y+5} ${r1(-w*.55)} ${y+3}Z" fill="${lipC}" opacity=".6"/>`;
    return base;
  }

  function ear(side, f, skin){
    const x = side*(f.w - 1), d = shade(skin,-.15);
    return `<path d="M${x} 2 Q${x + side*14} -2 ${x + side*13} 14 Q${x + side*12} 30 ${x - side*1} 32 Z" fill="${skin}" ${O(3)}/>` + L(`M${x + side*3} 8 Q${x + side*9} 10 ${x + side*6} 22`, 1.8, d);
  }

  /* 머리카락 셀 음영: 앞머리 끝의 어두운 면 + 정수리 천사링 하이라이트.
     앞머리 path 바로 뒤에 끼워 넣어 머리핀·머리띠 같은 장식은 그 위에 그대로 남긴다. */
  function hairCel(front, path, c, cid){
    if(!path) return front;
    const tag = `<path d="${path}"`;
    const at = front.indexOf(tag);
    if(at < 0) return front;
    const end = front.indexOf('/>', at) + 2;
    const id = 'h'+cid, dk = shade(c,-.3), lt = shade(c,.38);
    let saw = 'M-74 -86 Q0 -108 74 -86 L74 -80';
    for(let x=74, k=0; x>-74; k++){ const nx = x-9; saw += ` L${r1(x-4.5)} ${k%2? -70 : -74} L${r1(nx)} -79`; x = nx; }
    saw += ' Z';
    const cel = `<defs><clipPath id="${id}"><path d="${path}"/></clipPath></defs><g clip-path="url(#${id})">`
      + `<path d="${path}" fill="${dk}" opacity=".5" transform="translate(0 2)"/>`
      + `<path d="${path}" fill="${c}" transform="translate(0 -11)"/>`
      + `<path d="${saw}" fill="${lt}" opacity=".42"/>`
      + `<path d="M-74 -40 Q0 -20 74 -40 L74 -30 Q0 -12 -74 -30Z" fill="${dk}" opacity=".12"/>`
      + `</g><path d="${path}" fill="none" ${O(3.2)}/>`;
    return front.slice(0,end) + cel + front.slice(end);
  }

  function headSVG(D, ex, cid){
    const f = D.face, E = D.eyes, sk = D.skin, skD = shade(sk,-.14), hair = D.hair;
    const fp = facePath(f);
    let s = '';
    s += hair.back ? hair.back(D.hairC) : '';
    s += ear(-1, f, sk) + ear(1, f, sk);
    s += `<defs><clipPath id="f${cid}"><path d="${fp}"/></clipPath></defs>`;
    s += `<path d="${fp}" fill="${sk}" ${O(3.4)}/>` + chinLine(f);
    s += `<g clip-path="url(#f${cid})">`;
    if(hair.shadow) s += `<path d="${hair.shadow}" fill="${skD}" opacity=".7" transform="translate(0 9)"/>`;
    s += `<path d="M${-f.w-4} 20 C${-f.w} ${f.jy} ${-f.jw} ${f.jy+8} ${-f.cw-4} ${f.ch+2} L${-f.cw-20} ${f.ch+8} C${-f.jw+8} ${f.jy+2} ${-f.w+8} ${f.jy-6} ${-f.w+4} 20Z" fill="${skD}" opacity=".55"/>`;
    s += `</g>`;
    const bl = (ex==='happy'||ex==='cheer'||ex==='surprise'||ex==='point') ? Math.min(.7,(D.blush||.3)+.2) : (D.blush||.3);
    const by = (D.nose.y||34) + 6;
    if(bl>0) s += `<ellipse cx="${-E.sp-6}" cy="${by}" rx="15" ry="7" fill="#ff8f97" opacity="${bl}"/><ellipse cx="${E.sp+6}" cy="${by}" rx="15" ry="7" fill="#ff8f97" opacity="${bl}"/>`;
    if(D.blushLines && bl>.35) s += L(`M${-E.sp-14} ${by+1} l4 -4 M${-E.sp-6} ${by+2} l4 -4 M${E.sp-2} ${by+1} l4 -4 M${E.sp+6} ${by+2} l4 -4`, 1.3, '#e46872', .8);
    if(D.freckles) s += [[-E.sp-10,by-2],[-E.sp-4,by+2],[-E.sp+2,by-1],[E.sp-2,by-1],[E.sp+4,by+2],[E.sp+10,by-2]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.4" fill="#b8735a" opacity=".8"/>`).join('');
    if(D.extraFace) s += D.extraFace(ex);
    s += eye(-1, E, ex, sk, cid) + eye(1, E, ex, sk, cid);
    s += brow(-1, E, D.brow, ex, D.browC || shade(D.hairC,-.25)) + brow(1, E, D.brow, ex, D.browC || shade(D.hairC,-.25));
    s += nose(D.nose, sk);
    s += mouth(D.mouth, ex);
    if(ex==='sad') s += `<path d="M${-E.sp-8} 14 Q${-E.sp-12} 28 ${-E.sp-8} 34 Q${-E.sp-4} 28 ${-E.sp-8} 14Z" fill="#bfe6ff" stroke="#7fbfe8" stroke-width="1.5"/>`;

  /* ======================= 팔 (2관절 IK) ======================= */
  function ik(S, W, a, b, bendSign){
    let dx = W[0]-S[0], dy = W[1]-S[1];
    let d = Math.hypot(dx,dy); const maxd = (a+b)*0.995;
    if(d > maxd){ W = [S[0]+dx/d*maxd, S[1]+dy/d*maxd]; dx = W[0]-S[0]; dy = W[1]-S[1]; d = maxd; }
    d = Math.max(d, Math.abs(a-b)+1);
    const ang = Math.atan2(dy,dx);
    const cosA = (a*a + d*d - b*b)/(2*a*d);
    const A = Math.acos(Math.max(-1,Math.min(1,cosA)));
    const e = ang + bendSign*A;
    return {E:[S[0]+a*Math.cos(e), S[1]+a*Math.sin(e)], W};
  }
  function limb(pts, ws, fill){
    const n = pts.length, left = [], right = [];
    for(let i=0;i<n;i++){
      let tx, ty;
      if(i===0){ tx = pts[1][0]-pts[0][0]; ty = pts[1][1]-pts[0][1]; }
      else if(i===n-1){ tx = pts[i][0]-pts[i-1][0]; ty = pts[i][1]-pts[i-1][1]; }
      else { const ax = pts[i][0]-pts[i-1][0], ay = pts[i][1]-pts[i-1][1], bx = pts[i+1][0]-pts[i][0], by = pts[i+1][1]-pts[i][1];
        const la = Math.hypot(ax,ay)||1, lb = Math.hypot(bx,by)||1; tx = ax/la + bx/lb; ty = ay/la + by/lb; }
      const l = Math.hypot(tx,ty)||1; const nx = -ty/l, ny = tx/l, h = ws[i]/2;
      left.push([pts[i][0]+nx*h, pts[i][1]+ny*h]); right.push([pts[i][0]-nx*h, pts[i][1]-ny*h]);
    }
    let d = `M${r1(left[0][0])} ${r1(left[0][1])}`;
    for(let i=1;i<n;i++) d += ` L${r1(left[i][0])} ${r1(left[i][1])}`;
    d += ` L${r1(right[n-1][0])} ${r1(right[n-1][1])}`;

  function lerp(p,q,t){ return [p[0]+(q[0]-p[0])*t, p[1]+(q[1]-p[1])*t]; }

  function handSVG(W, dir, type, skin, sc, side){
    const ang = Math.atan2(dir[1],dir[0])*180/Math.PI - 90;

    if(type==='point'){
      g = `<path d="M-10 0 Q-12 14 -4 18 Q4 20 10 14 Q12 4 9 -2 Q0 -6 -10 0Z" fill="${skin}" ${O(2.8)}/>` +
        `<path d="M-3 12 L-4 36 Q0 41 4 36 L4 12" fill="${skin}" ${O(2.6)}/>` + `<path d="M${side*-9} 4 Q${side*-17} 10 ${side*-13} 16 Q${side*-8} 16 ${side*-5} 10" fill="${skin}" ${O(2.4)}/>` + L('M-6 14 Q0 16 4 13', 1.4, d);

function writeBox(cfg) {
  return new Promise(res => {
    const hard = G.S.diff === 'hard';
    const crit = (hard && cfg.hardRubric) || cfg.rubric || ['reason', 'action'];
    const need = (hard && cfg.hardNeed != null) ? cfg.hardNeed : (cfg.need != null ? cfg.need : Math.max(1, crit.length - 1));
    const minLen = (hard && cfg.hardMin) || cfg.min || (hard ? 60 : 25);
    const q = (hard && cfg.hardQ) || cfg.q;
    const guide = (hard && cfg.hardGuide) || cfg.guide;
    const m = modal(`<h2>${fmt(cfg.title || '✍ 세계시민 노트')}</h2><p class="wq">${fmt(q)}</p>${guide ? `<div class="easy">${fmt(guide)}</div>` : ''}
      <div class="rubric">${crit.map(k => `<span class="rb" data-k="${k}">${RUBRIC[k].icon} ${RUBRIC[k].name}</span>`).join('')}<span class="rbneed">기준 ${need}개 이상 · ${minLen}자 이상</span></div>
      <textarea class="wr" placeholder="${plain(cfg.ph || '내 생각을 적어 보세요.')}"></textarea><div class="wfb"></div>
      <div class="row" style="justify-content:space-between;margin-top:12px"><span class="fb"></span><span class="row"><button class="btn ghost" data-chk>🔍 피드백 받기</button><button class="btn gold" data-ok disabled>제출하기</button></span></div>`, { cls: 'paper write', x: false });
    m.p.style.width = '940px';
    const ta = m.p.querySelector('textarea'), wfb = m.p.querySelector('.wfb'), ok = m.p.querySelector('[data-ok]');
    if (cfg.prefill) ta.value = plain(cfg.prefill);
    setTimeout(() => ta.focus(), 50);
    let last = null;
    const check = () => {
      const v = ta.value.trim();
      const r = evalWrite(v, crit, cfg, minLen);
      last = r;
      m.p.querySelectorAll('.rb').forEach(b => b.classList.toggle('on', r.met.includes(b.dataset.k)));
      const stars = '★'.repeat(r.met.length) + '☆'.repeat(crit.length - r.met.length);
      const pass = r.met.length >= need && v.length >= minLen && !r.flag;
      wfb.innerHTML = `<div class="wstar">${stars} <small>기준 ${r.met.length} / ${crit.length} · ${v.length}자</small></div>` +
        (r.flag ? `<p class="bad">⚠ ${r.flag}</p>` : '') +
        r.good.map(t => `<p class="good">👍 ${t}</p>`).join('') + r.tips.map(t => `<p class="tip">✏ ${t}</p>`).join('') +
        (pass ? `<p class="good"><b>제출할 수 있어요!</b> ${r.met.length < crit.length ? '조금 더 다듬으면 별을 더 받을 수 있어요.' : '모든 기준을 채운 멋진 글이에요.'}</p>`
              : `<p class="tip"><b>${v.length < minLen ? `${minLen - v.length}자 이상 더 써 주세요. ` : ''}${r.met.length < need ? `기준을 ${need - r.met.length}개 더 채우면 제출할 수 있어요.` : ''}</b></p>`) +
        (cfg.model && !pass ? `<details><summary>예시 글 엿보기 (그대로 베끼지 말고 참고만!)</summary><p>${fmt((hard && cfg.hardModel) || cfg.model)}</p></details>` : '');
      ok.disabled = !pass;

    };
    m.p.querySelector('[data-chk]').onclick = () => { beep('click'); check(); };
    ta.oninput = () => { ok.disabled = true; };
    ta.onkeydown = e => e.stopPropagation();

      award(cfg.skill || 'part', last.met.length, crit.length);

      setTimeout(() => { check(); if (ok.disabled) { console.error('AUTOTEST write fail ' + cfg.key + ' ' + JSON.stringify(last)); ok.disabled = false; } ok.click(); }, 0);
    }
  });
}
/* 글쓰기 피드백 기준 (규칙 기반 · 학생 글은 이 기기 밖으로 나가지 않음) */
const RUBRIC = {
  reason: {name: '이유', icon: '🧠', re: /왜냐하면|때문|이므로|므로|라서|해서|이유는|덕분|그래야|그러면|니까/, good: '이유를 들어 설명했어요.', tip: '“왜냐하면 ~ 때문이다”처럼 그렇게 생각한 이유를 붙여 보세요.'},
  action: {name: '실천', icon: '👣', re: /하겠|할 것|실천|해야|하자|할 수 있|하고 싶|해 보|하기로|하려고|노력|참여|만들|알리|돕|시작|제안/, good: '구체적인 행동이 담겨 있어요.', tip: '“나는 ~을 하겠다”처럼 직접 할 수 있는 행동을 적어 보세요.'},
  concept: {name: '핵심 개념', icon: '🔑', re: null, good: '세계시민교육의 핵심 개념을 사용했어요.', tip: '이번 시대에서 배운 핵심 낱말을 넣어 보세요.'},
  local: {name: '인천 연결', icon: '📍', re: /인천|우리 동네|우리 학교|우리 마을|송도|강화|부평|차이나타운|함박|공항|항만|갯벌|매립지|연수|제물포|개항|영종|옹진|미추홀|남동|계양|서구/, good: '인천(우리 지역)과 연결했어요.', tip: '인천이나 우리 동네의 장소·사람과 연결해 보세요. (Think globally, act locally!)'},
  persp: {name: '다른 입장', icon: '🤝', re: /입장|다른 사람|상대|친구|이웃|함께|모두|서로|공감|마음|처지|어르신|주민|어민|난민|이주|가족|동생/, good: '다른 사람의 입장을 생각했어요.', tip: '이 문제로 영향을 받는 사람의 입장이나 마음을 한 문장 넣어 보세요.'},
  evid: {name: '근거 자료', icon: '📚', re: /자료|선언|목표|SDG|성취기준|기구|사례|예를 들어|예시|에 따르면|처럼|보면|조사|계획|조항|제\d+조/, good: '자료나 사례를 근거로 들었어요.', tip: '게임에서 모은 자료(선언, 목표, 국제기구, 사례)를 “~에 따르면”처럼 근거로 들어 보세요.'}
};
function evalWrite(v, crit, cfg, minLen) {
  const met = [], good = [], tips = [];
  const kw = cfg.keywords || ['인권', '평화', '존중', '다양', '공존', '협력', '세계시민', '환경', '기후', '차별', '지속가능', '연대', '교육', '배움'];
  crit.forEach(k => {
    const R = RUBRIC[k];
    const hit = k === 'concept' ? kw.some(w => v.includes(w)) : R.re.test(v);
    if (hit) { met.push(k); good.push(R.good); } else tips.push(k === 'concept' ? `이번 시대의 핵심 낱말(예: ${kw.slice(0, 4).join(', ')})을 넣어 보세요.` : R.tip);
  });
  let flag = null;
  const chars = v.replace(/\s/g, '');
  if (chars.length > 10 && new Set(chars).size < chars.length * 0.18) flag = '같은 글자를 반복하고 있어요. 내 생각을 문장으로 적어 주세요.';
  const sents = v.split(/[.!?。\n]|다 |요 /).filter(x => x.trim().length > 3).length;
  if (G.S.diff === 'hard' && sents < 2 && v.length >= minLen) { flag = flag || '어려움 단계에서는 두 문장 이상으로 생각을 나누어 써야 해요.'; }
  return { met, good, tips, flag };
}

/* ---------- 명령 실행 ---------- */
const LINE_RE = /^([a-z]+[a-z0-9_]*)(?:\.([a-z]+))?:\s?([\s\S]*)$/;
async function exec(c) {
  const S = G.S;
  if (typeof c === 'string') {
    if (c.startsWith('>')) return say(null, null, c.slice(1).trim());
    const m = c.match(LINE_RE);
    if (m && m[1] === 'pal') return say(palKey(), m[2] || 'normal', m[3]);
    if (m && CH[m[1]]) return say(m[1], m[2] || 'normal', m[3]);
    return say(null, null, c);
  }
  if (typeof c === 'function') return c(G);
  if (c.bg) { await setBg(c.bg, c.place); if (c.clear !== false) clearStage(); return; }
  if (c.place !== undefined && !c.bg && Object.keys(c).length === 1) return setPlace(c.place);
  if (c.hard || c.easy) return runList(G.S.diff === 'hard' ? (c.hard || []) : (c.easy || []));
  if (c.stamp) return restorePage(c.stamp);
  if (c.view) return openArchive(true, c.view);
  if (c.stage) { clearStage(); c.stage.forEach(s => { let k = Array.isArray(s) ? s[0] : s; if (k === 'pal') k = palKey(); showChar(k, Array.isArray(s) ? s[1] : 'normal'); }); focusChar(null); return sleep(G.auto ? 0 : 250); }
  if (c.show) { showChar(c.show === 'pal' ? palKey() : c.show, c.expr || 'normal', { side: c.side }); return; }
  if (c.hide) { if (c.hide === 'all') clearStage(); else [].concat(c.hide).forEach(hideChar); return sleep(G.auto ? 0 : 200); }
  if (c.clue) { for (const id of [].concat(c.clue)) await addClue(id, c.silent); return; }
  if (c.law) { for (const id of [].concat(c.law)) await addLaw(id, c.silent); return; }
  if (c.show_item) return showItem(c.show_item);
  if (c.doc) return showDoc(c.doc);
  if (c.memo) { const k = G.caseNo || 0; (S.memo[k] = S.memo[k] || []); if (!S.memo[k].includes(c.memo)) { S.memo[k].push(c.memo); toast('📝 사건 기록이 추가되었어요'); save(); } return; }
  if (c.choice) return runChoice(c.choice);
  if (c.hub) return runHub(c.hub);
  if (c.room) return runRoom(c.room);
  if (c.nav) return runNav(c.nav);
  if (c.present) return present(c.present);
  if (c.puzzle) return runPuzzle(c.puzzle);
  if (c.write) return writeBox(c.write);
  if (c.input === 'name') { S.name = await askName(); save(); return; }
  if (c.if !== undefined) { const ok = typeof c.if === 'function' ? c.if(S) : (c.if.startsWith('!') ? !S.flags[c.if.slice(1)] : !!S.flags[c.if]); return runList(ok ? (c.then || []) : (c.else || [])); }
  if (c.set) { Object.assign(S.flags, c.set); save(); return; }
  if (c.sc) { for (const k in c.sc) award(k, c.sc[k], c.mx && c.mx[k]); return; }
  if (c.val) { for (const k in c.val) S.vals[k] = (S.vals[k] || 0) + c.val[k]; save(); return; }
  if (c.fx) return fx(c.fx);
  if (c.wait) return sleep(G.auto ? 0 : c.wait);
  if (c.casecard) return caseCard();
  if (c.scene) { G.pendingScene = c.scene; return; }
  if (c.page) return restorePage(c.page);
  if (c.toast) return toast(c.toast);
  if (c.rec) { recordChoice(c.rec, c.text); return; }
  if (c.end) return endCase();
  if (c.ending) return showEnding();
  if (c.save) { save(); return; }
  console.warn('unknown command', c);
}
function recordChoice(q, a) { const S = G.S; S.choices = S.choices.filter(x => x.q !== q); S.choices.push({ c: G.caseNo, q, a: plain(a) }); save(); }
async function runList(list) {
  const tok = G.token;
  for (const c of list) {
    if (tok !== G.token) return;
    await exec(c);
    if (G.pendingScene) return;
  }
}
async function fx(name) {
  const g = $('#game');
  if (name === 'shake') { g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake'); beep('bad'); }
  else if (name === 'flash') { g.classList.remove('flash'); void g.offsetWidth; g.classList.add('flash'); beep('clue'); }
  else if (name.startsWith('bounce:')) { const s = G.stage.find(x => x.key === name.slice(7)); if (s) { s.el.classList.remove('bounce'); void s.el.offsetWidth; s.el.classList.add('bounce'); } }
  else if (name === 'highfive') { G.stage.forEach(s => { s.el.innerHTML = spriteSVG(s.key, 'cheer'); s.expr = 'cheer'; s.el.classList.remove('bounce', 'dim'); void s.el.offsetWidth; s.el.classList.add('bounce'); }); beep('ok'); }
  return sleep(G.auto ? 0 : 450);
}

/* ---------- 선택 / 허브 ---------- */
async function runChoice(ch) {
  while (true) {
    const opts = ch.opts.filter(o => !o.if || o.if(G.S));
    const i = await choose(ch.q, opts, { autoPick: ch.autoPick });
    const o = opts[i];
    if (ch.rec) recordChoice(ch.rec, o.t);
    if (o.val) for (const k in o.val) G.S.vals[k] = (G.S.vals[k] || 0) + o.val[k];
    if (o.sc) for (const k in o.sc) award(k, o.sc[k], o.mx && o.mx[k]);
    if (o.set) Object.assign(G.S.flags, o.set);
    save();
    if (o.then) await runList(o.then);
    if (G.pendingScene) return;
    if (!o.retry) return;
  }
}
async function runHub(h) {
  const S = G.S, used = new Set();
  if (!S.hubs[h.id]) { S.hubs[h.id] = []; if (h.debate) award('comm', 0, h.opts.length); }
  while (true) {
    const opts = h.opts.map((o, i) => ({ ...o, _i: i, _used: used.has(i) || S.hubs[h.id].includes(i) })).filter(o => !o.if || o.if(S));
    const canExit = used.size >= (h.min || 0) || S.hubs[h.id].length >= (h.min || 0);
    const list = [...opts];
    if (canExit) list.push({ t: h.exit || '이제 결정할 준비가 됐어.', _exit: true, best: true });
    const i = await choose(h.q + (canExit ? '' : `<br><span style="font-size:17px;color:#cfc6a8">(최소 ${h.min}개 이상 들어 보세요)</span>`), list, { autoPick: G.auto ? (list.findIndex(o => !o._used && !o._exit) >= 0 ? list.findIndex(o => !o._used && !o._exit) : list.length - 1) : null });
    const o = list[i];
    if (o._exit) return;
    used.add(o._i);
    if (!S.hubs[h.id].includes(o._i)) { S.hubs[h.id].push(o._i); if (h.debate) award('comm', 1, 0); if (o.sc) for (const k in o.sc) award(k, o.sc[k]); save(); }
    await runList(o.then || []);
    if (G.pendingScene) return;
  }
}

/* ---------- 조사(방탈출) ---------- */
function curCase() { return CASES[G.caseNo]; }
async function runRoom(id) {
  const R = curCase().rooms[id];
  const S = G.S; S.visited[id] = S.visited[id] || []; G._entry = new Set();
  await setBg(R.bg, R.place); clearStage(); showDialog(false);
  if (R.intro && !S.flags['room_' + id]) { S.flags['room_' + id] = 1; await runList(R.intro); clearStage(); showDialog(false); }
  G.hintStack.push({ id: 'room_' + id, hints: R.hints });
  try {
    while (true) {
      const pick = await roomPick(R, id);
      if (pick === '__done') {
        const miss = (typeof R.need === 'function' ? R.need(S) : (R.need || [])).filter(n => !hasItem(n));
        if (miss.length) { G.inRoom = false; await runList(R.needMsg || [`pal.think: 잠깐, {name}! 여기서 아직 확인하지 않은 게 있어. 자료가 ${miss.length}개쯤 더 필요해 보여.`]); clearStage(); showDialog(false); continue; }
        break;
      }
      const it = pick;
      if (!S.visited[id].includes(it.id)) { S.visited[id].push(it.id); save(); }
      G.inRoom = false; clearStage();
      await runList(it.then || []);
      clearStage(); showDialog(false);
      if (curBg !== R.bg) await setBg(R.bg, R.place);
    }
  } finally { G.hintStack.pop(); G.inRoom = false; $('#hotspots').innerHTML = ''; $('#investBar').style.display = 'none'; $('#investHelp').style.display = 'none'; }
}
function roomPick(R, id) {
  return new Promise(res => {

    const [a, b] = sel; const cb = (C.combos || []).find(x => (x.a === a && x.b === b) || (x.a === b && x.b === a));

/* ---------- 증거 제시 (대화 중) ---------- */
async function present(cfg) {
  const S = G.S; let tries = 0;
  while (true) {
    showDialog(false);
    let r;
    if (G.auto) r = cfg.ans.find(hasItem) || null;
    else { const m = modal('', { cls: 'pz paper', x: false }); m.p.innerHTML = `<div class="phead"><span class="ptype">자료 제시</span><span class="ptitle">${fmt(cfg.q)}</span></div><div class="pintro">${fmt(cfg.intro || '')}</div>`; r = await pickItem(m.p, cfg.q, cfg.filter); m.close(); }
    if (!r) { await runList(cfg.cancel || []); return false; }
    if (cfg.ans.includes(r)) { if (cfg.sc) for (const k in cfg.sc) award(k, Math.max(0, cfg.sc[k] - tries), cfg.sc[k]); await runList(cfg.ok || []); return true; }
    tries++; S.attempts['present_' + (cfg.id || '')] = tries; save(); beep('bad');
    await runList((cfg.fail && cfg.fail[r]) || cfg.failDefault || ['>상대가 고개를 갸웃한다. 이 자료로는 이야기가 이어지지 않는 것 같다.']);
  }
}

/* ---------- 장소 안내도(방탈출 이동) ---------- */
function placeOpen(P) { const S = G.S; return !P.lock || S.flags['unlock_' + P.id] || (P.lock.when && P.lock.when(S)); }
function placeDone(P) { const R = curCase().rooms[P.room]; return R.doneIf ? R.doneIf(G.S) : (R.clues || []).every(hasItem); }
async function runNav(id) {
  const N = curCase().navs[id]; const S = G.S; let guard = 0;
  G.hintStack.push({ id: 'nav_' + id, hints: N.hints });
  try {
    while (true) {
      if (G.auto && ++guard > 80) { console.error('NAV LOOP ' + id); break; }
      if (G.auto) for (const cb of (curCase().combos || [])) if (hasItem(cb.a) && hasItem(cb.b) && !hasItem(cb.result)) await doCombo(cb);
      await setBg(N.bg, N.place); clearStage(); showDialog(false);
      const pick = await navPick(N);
      if (pick === '__done') { if (N.done(S)) break; await runList(N.notDone ? N.notDone(S) : ['pal.think: 아직 풀리지 않은 미션이 남아 있어.']); continue; }
      const P = N.places.find(p => p.id === pick);
      if (!placeOpen(P)) {
        if (P.lock.puzzle) { if (P.lock.before) await runList(P.lock.before); const ok = await runPuzzle(P.lock.puzzle); if (!ok) continue; S.flags['unlock_' + P.id] = 1; save(); if (P.lock.after) await runList(P.lock.after); }
        else { await runList(P.lock.msg || ['>문이 잠겨 있다.']); continue; }
      }
      await runRoom(P.room);
      if (G.pendingScene) return;
    }
  } finally { G.hintStack.pop(); }
}
function navPick(N) {
  return new Promise(res => {
    const S = G.S;
    const w = el('div', 'panel-wrap'); w.style.zIndex = 20 + (++G.mz); w.style.background = 'rgba(8,10,24,.45)';
    const total = Object.keys(CLUES).filter(i => isClue(i) && CLUES[i].c === G.caseNo).length, got = S.clues.filter(i => isClue(i) && CLUES[i].c === G.caseNo).length;
    const p = el('div', 'panel paper', `<h2>🗺 ${fmt(N.title)}</h2><div class="sub">${fmt(N.sub || '')} · 🔎 모은 자료 <b>${got} / ${total}</b> · 📖 GCED 자료 ${S.laws.filter(l => (N.laws || []).includes(l)).length} / ${(N.laws || []).length}</div><div class="navgrid"></div><div class="row" style="justify-content:space-between;margin-top:14px"><div class="row"><button class="btn small ghost" data-nb>🗂 수첩</button><button class="btn small ghost" data-arc>📖 GCED 도감</button><button class="btn small ghost" data-hint>💡 힌트</button></div><button class="btn gold" data-done>${fmt(N.doneLabel || '미션 회의 열기 →')}</button></div>`);
    p.style.width = '1120px';
    const grid = p.querySelector('.navgrid');
    N.places.filter(P => !P.if || P.if(S)).forEach(P => {
      const open = placeOpen(P), done = open && placeDone(P), visited = S.visited[P.room] && S.visited[P.room].length;
      const st = !open ? `🔒 ${fmt(P.lockLabel || '잠김')}` : done ? '✔ 탐험 완료' : visited ? '🔍 탐험 중' : '✨ 새 장소';
      const c = el('div', 'navcard' + (open ? '' : ' locked') + (done ? ' done' : ''), `<div class="ni">${P.icon}</div><div class="nn">${fmt(P.name)}</div><div class="nd">${fmt(P.desc || '')}</div><div class="ns">${st}</div>`);
      c.onclick = () => { beep('click'); close(P.id); };
      grid.appendChild(c);
    });
    const close = v => { w.remove(); G.modals--; res(v); };
    p.querySelector('[data-done]').onclick = () => close('__done');
    p.querySelector('[data-nb]').onclick = () => openNotebook();
    p.querySelector('[data-arc]').onclick = () => openArchive(true);
    p.querySelector('[data-hint]').onclick = () => openHint();
    w.appendChild(p); $('#ovl').appendChild(w); G.modals++;
    if (G.auto) {
      const cand = N.places.filter(P => !P.if || P.if(S)).find(P => !placeDone(P) && (placeOpen(P) || P.lock.puzzle) && !(G._autoTried || {})[P.id + ':' + S.clues.length]);
      G._autoTried = G._autoTried || {}; if (cand) G._autoTried[cand.id + ':' + S.clues.length] = 1;
      setTimeout(() => close(cand ? cand.id : '__done'), 0);
    }
  });
}

/* ============ 퍼즐 시스템 ============ */
const PZ_TAG = { evidence: '자료 제시 미션', contra: '모순 찾기 미션', match: '카드 연결 미션', select: '자료 분석 미션', code: '시간의 암호', order: '연표 맞추기 미션', build: '문장 완성 미션', quiz: '세계시민 퀴즈', map: '세계지도 미션', pins: '지도 배치 미션' };
const WRONG_MSG = ['자료를 다시 읽어 볼까요? 수첩과 GCED 도감에 실마리가 있어요.', '그 판단을 뒷받침할 근거가 있을까요?', '조금 더 생각해 봐요. 다른 사람의 입장에서 보면 어떨까요?'];
function shuffleDet(arr, seed) { const a = [...arr]; let x = seed || 7; for (let i = a.length - 1; i > 0; i--) { x = (x * 9301 + 49297) % 233280; const j = Math.floor(x / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hashStr(s) { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 100000; return h || 7; }

async function runPuzzle(id) {
  const S = G.S; let P = curCase().puzzles[id];
  if (typeof P === 'function') P = P(S);
  if (!P) { console.error('no puzzle', id); return false; }
  G.hintStack.push({ id: 'pz_' + id, hints: P.hints });
  showDialog(false);
  let r;
  try {
    while (true) {
      r = await puzzleUI(id, P);
      if (r === 'retreat') { await runRoom(P.retreat); continue; }
      break;
    }
  } finally { G.hintStack.pop(); }
  if (r === 'cancel') return false;
  if (!S.solved[id]) {
    S.solved[id] = 1; const pts = P.pts || 3, w = S.attempts[id] || 0;
    award(P.skill || 'reason', Math.max(1, pts - w), pts);
    if (P.skill2) award(P.skill2, Math.max(1, pts - w), pts);
    save();
  }
  if (P.after) await runList(P.after);
  return true;
}

function puzzleUI(id, P) {
  return new Promise(res => {
    const S = G.S;
    const m = modal(`<div class="phead"><span class="ptype">${P.tag || PZ_TAG[P.type]}</span><span class="ptitle">${fmt(P.title)}</span></div>
      <div class="pintro">${fmt(P.intro || '')}</div><div class="pbody"></div>
      <div class="pfoot"><div class="row"><button class="btn small ghost" data-nb>🗂 수첩</button><button class="btn small ghost" data-law>📖 GCED 도감</button><button class="btn small ghost" data-hint>💡 힌트</button>${P.retreat ? '<button class="btn small ghost" data-ret>🔍 현장 다시 조사</button>' : ''}${P.cancel ? '<button class="btn small ghost" data-cancel>↩ 나중에 풀기</button>' : ''}${G.teacher ? '<button class="btn small ghost" data-tskip>👩‍🏫 정답 보고 넘기기</button>' : ''}</div>
      <div class="fb"></div><button class="btn gold" data-go>${fmt(P.submit || '제출하기')}</button></div>`, { cls: 'pz paper', x: false });
    const body = m.p.querySelector('.pbody'), fbEl = m.p.querySelector('.fb'), go = m.p.querySelector('[data-go]');
    m.p.querySelector('[data-nb]').onclick = () => openNotebook();
    m.p.querySelector('[data-law]').onclick = () => openArchive(true);
    m.p.querySelector('[data-hint]').onclick = () => openHint();
    if (P.retreat) m.p.querySelector('[data-ret]').onclick = () => { m.close(); res('retreat'); };
    if (P.cancel) m.p.querySelector('[data-cancel]').onclick = () => { m.close(); res('cancel'); };
    const fb = (t, ok) => { fbEl.innerHTML = fmt(t); fbEl.classList.toggle('ok', !!ok); };
    let cdTimer = null;
    const wrong = (t) => {
      S.attempts[id] = (S.attempts[id] || 0) + 1; save(); beep('bad');
      const msg = t || WRONG_MSG[(S.attempts[id] - 1) % WRONG_MSG.length];
      fb(msg); m.p.classList.remove('shake'); void m.p.offsetWidth; m.p.classList.add('shake');
      // 연타(찍기) 방지: 두 번째 오답부터 생각할 시간
      const n = S.attempts[id];
      if (n >= 2 && !G.auto) {
        let left = Math.min(10 * (n - 1), 30);
        go.disabled = true; const label = go.innerHTML;
        clearInterval(cdTimer);
        const tick = () => { go.innerHTML = `⏳ ${left}초`; fb(msg + `<br><small style="color:#7c7f93">찍어서 맞히기는 어려워요. ${left}초 동안 수첩과 GCED 도감을 다시 읽어 보세요.</small>`); if (left-- <= 0) { clearInterval(cdTimer); go.disabled = false; go.innerHTML = label; fb(msg); } };
        tick(); cdTimer = setInterval(tick, 1000);
      }
    };
    const solved = async (t) => { clearInterval(cdTimer); beep('ok'); fb(t || P.okText || '정답의 실마리를 찾았어요!', true); go.disabled = true; await sleep(G.auto ? 0 : 1300); m.close(); res('ok'); };
    const T = PZ[P.type];
    const ctl = T(body, P, { fb, wrong, solved, id, panel: m.p });
    go.onclick = () => ctl.check();
    if (G.teacher) m.p.querySelector('[data-tskip]').onclick = () => { const hs = P.hints || []; fb('👩‍🏫 교사용 정답 안내: ' + (hs.length ? hs[hs.length - 1] : '이 미션은 정답 안내가 없어요.'), true); clearInterval(cdTimer); go.disabled = false; go.innerHTML = '다음으로 넘기기 →'; go.onclick = () => solved('교사용 모드로 넘겼어요.'); };
    if (G.auto) setTimeout(() => { if (ctl.auto) ctl.auto(); solved(); }, 0);
  });
}
